<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MASHUP STUDIO</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;touch-action:manipulation}
  html,body{height:100%;overflow:hidden}
  body{
    background:#04040a;
    background-image:
      radial-gradient(circle at 15% 0%,rgba(120,60,255,.20),transparent 45%),
      radial-gradient(circle at 85% 100%,rgba(255,60,140,.16),transparent 45%);
    color:#fff;font-family:'Segoe UI',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:8px;gap:8px;
    padding-top:calc(8px + env(safe-area-inset-top));
    padding-bottom:calc(8px + env(safe-area-inset-bottom));
  }
  #app{display:flex;flex-direction:column;width:100%;height:100%;
    max-width:1100px;gap:8px;align-items:center}

  .head{display:flex;align-items:center;gap:8px;width:100%}
  .logo{width:9px;height:9px;border-radius:50%;background:#7a5cff;
    box-shadow:0 0 12px #7a5cff,0 0 22px #7a5cff;flex-shrink:0}
  .title{font-size:.85rem;font-weight:800;letter-spacing:4px;
    background:linear-gradient(90deg,#7a5cff,#ff3b9d,#ffb03b);
    -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  .spacer{flex:1}
  .status{font-size:.6rem;color:#7a7a9a;letter-spacing:.3px;max-width:260px;
    text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn{background:#1a1a2a;border:none;color:#cfcfe8;width:32px;height:32px;
    border-radius:9px;font-size:.95rem;cursor:pointer;flex-shrink:0;
    box-shadow:inset 0 0 0 1px #23233a}
  .iconbtn:active{background:#2a2a44}

  /* DECK */
  .deck{width:100%;background:linear-gradient(180deg,#0e0e18,#0a0a12);
    border-radius:14px;box-shadow:inset 0 0 0 1px #1e1e30;
    padding:10px;display:flex;flex-direction:column;gap:7px}
  .deck.A{box-shadow:inset 0 0 0 1px #5c5cff,0 0 18px rgba(92,92,255,.15)}
  .deck.B{box-shadow:inset 0 0 0 1px #ff3b9d,0 0 18px rgba(255,59,157,.15)}
  .deck-head{display:flex;align-items:center;gap:8px}
  .deck-tag{font-size:.7rem;font-weight:800;letter-spacing:2px;padding:4px 8px;
    border-radius:6px;flex-shrink:0}
  .deck.A .deck-tag{background:rgba(92,92,255,.2);color:#9a9aff}
  .deck.B .deck-tag{background:rgba(255,59,157,.2);color:#ff9ad4}
  .deck-name{font-size:.65rem;color:#9a9ab8;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;flex:1}
  .deck-info{font-size:.58rem;color:#7ad4ff;flex-shrink:0}

  /* waveform */
  .wave-wrap{position:relative;width:100%;height:70px;background:#08080f;
    border-radius:8px;overflow:hidden;cursor:pointer;
    box-shadow:inset 0 0 0 1px #1e1e30}
  .wave-wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;
    box-shadow:0 0 8px #fff;pointer-events:none;left:0;z-index:3}
  .loop-region{position:absolute;top:0;bottom:0;
    background:rgba(122,92,255,.18);border-left:2px solid #7a5cff;
    border-right:2px solid #7a5cff;pointer-events:none;z-index:2;display:none}

  /* deck controls */
  .deck-ctrls{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .cbtn{background:linear-gradient(180deg,#1a1a2a,#12121e);border:none;color:#cfcfe8;
    padding:9px 10px;border-radius:8px;font-size:.66rem;font-weight:600;cursor:pointer;
    box-shadow:inset 0 0 0 1px #23233a;transition:background .15s,box-shadow .15s;
    display:flex;align-items:center;gap:4px;white-space:nowrap}
  .cbtn:active{background:#23233a}
  .cbtn.on{background:#2a1a3a;color:#c9a0ff;box-shadow:inset 0 0 0 1px #7a5cff,0 0 12px rgba(122,92,255,.4)}
  .cbtn.play{color:#7aff9a}
  .cbtn.play.on{background:#1a2a1e;color:#7aff9a;box-shadow:inset 0 0 0 1px #7aff9a,0 0 12px rgba(122,255,154,.4)}

  .knob-row{display:flex;gap:5px;flex-wrap:wrap;width:100%}
  .knob{display:flex;flex-direction:column;gap:2px;flex:1;min-width:60px}
  .knob label{font-size:.5rem;color:#7a7a9a;letter-spacing:.5px;text-transform:uppercase}
  .knob input[type=range]{width:100%;height:18px;accent-color:#7a5cff;cursor:pointer}
  .knob .val{font-size:.55rem;color:#cfcfe8;text-align:right;font-weight:600}

  /* crossfader + master */
  .master{width:100%;background:linear-gradient(180deg,#0e0e18,#0a0a12);
    border-radius:14px;box-shadow:inset 0 0 0 1px #1e1e30;padding:10px;
    display:flex;flex-direction:column;gap:7px}
  .xf-row{display:flex;align-items:center;gap:8px;font-size:.6rem;color:#9a9ab8}
  .xf-row span:first-child{color:#9a9aff;font-weight:700}
  .xf-row span:last-child{color:#ff9ad4;font-weight:700}
  .xf-row input{flex:1;height:28px;accent-color:#ff3b9d;cursor:pointer}

  .bar{display:flex;gap:5px;width:100%;flex-wrap:wrap}
  .btn{flex:1;background:linear-gradient(180deg,#1a1a2a,#12121e);color:#cfcfe8;
    border:none;padding:11px 6px;border-radius:10px;font-size:.68rem;font-weight:600;
    cursor:pointer;box-shadow:inset 0 0 0 1px #23233a;
    display:flex;align-items:center;justify-content:center;gap:4px;
    white-space:nowrap;min-width:70px}
  .btn:active{background:#23233a}
  .btn.rec{color:#ff8a5c}
  .btn.rec.on{background:#3a1a10;box-shadow:inset 0 0 0 1px #ff8a5c,0 0 18px rgba(255,138,92,.5)}
  .btn.stop{color:#ff6b8a;background:linear-gradient(180deg,#2a0f1c,#1a0812)}
  input[type=file]{display:none}

  /* ekran küçükse */
  @media (max-height:700px){
    .wave-wrap{height:55px}
    .deck{padding:8px;gap:5px}
  }
  @media (orientation:landscape) and (max-height:500px){
    .head{display:none}
    .wave-wrap{height:45px}
  }
</style>
</head>
<body>
<div id="app">

  <div class="head">
    <div class="logo"></div>
    <div class="title">MASHUP STUDIO</div>
    <div class="spacer"></div>
    <div class="status" id="status">Hazır — iki müzik yükle, birleştir</div>
    <button class="iconbtn" id="fsBtn" title="Tam ekran">⛶</button>
  </div>

  <!-- DECK A -->
  <div class="deck A" id="deckA">
    <div class="deck-head">
      <div class="deck-tag">A</div>
      <div class="deck-name" id="nameA">Müzik yükle →</div>
      <div class="deck-info" id="infoA">—</div>
    </div>
    <div class="wave-wrap" id="waveWrapA">
      <canvas id="waveA"></canvas>
      <div class="loop-region" id="loopA"></div>
      <div class="playhead" id="phA"></div>
    </div>
    <div class="deck-ctrls">
      <button class="cbtn play" id="playA">▶ Çal</button>
      <button class="cbtn" id="loopBtnA">⟲ Loop</button>
      <button class="cbtn" id="resetA">⏮ Baş</button>
      <button class="cbtn" id="halfA">½ Hız</button>
      <button class="cbtn" id="doubleA">2× Hız</button>
    </div>
    <div class="knob-row">
      <div class="knob"><label>Vol A</label><input type="range" id="volA" min="0" max="100" value="100"><div class="val" id="volAVal">100</div></div>
      <div class="knob"><label>BPM A</label><input type="range" id="bpmA" min="60" max="200" value="120"><div class="val" id="bpmAVal">120</div></div>
      <div class="knob"><label>Low</label><input type="range" id="eqLowA" min="-20" max="20" value="0"><div class="val" id="eqLowAVal">0</div></div>
      <div class="knob"><label>Mid</label><input type="range" id="eqMidA" min="-20" max="20" value="0"><div class="val" id="eqMidAVal">0</div></div>
      <div class="knob"><label>High</label><input type="range" id="eqHighA" min="-20" max="20" value="0"><div class="val" id="eqHighAVal">0</div></div>
    </div>
  </div>

  <!-- DECK B -->
  <div class="deck B" id="deckB">
    <div class="deck-head">
      <div class="deck-tag">B</div>
      <div class="deck-name" id="nameB">Müzik yükle →</div>
      <div class="deck-info" id="infoB">—</div>
    </div>
    <div class="wave-wrap" id="waveWrapB">
      <canvas id="waveB"></canvas>
      <div class="loop-region" id="loopB"></div>
      <div class="playhead" id="phB"></div>
    </div>
    <div class="deck-ctrls">
      <button class="cbtn play" id="playB">▶ Çal</button>
      <button class="cbtn" id="loopBtnB">⟲ Loop</button>
      <button class="cbtn" id="resetB">⏮ Baş</button>
      <button class="cbtn" id="halfB">½ Hız</button>
      <button class="cbtn" id="doubleB">2× Hız</button>
    </div>
    <div class="knob-row">
      <div class="knob"><label>Vol B</label><input type="range" id="volB" min="0" max="100" value="100"><div class="val" id="volBVal">100</div></div>
      <div class="knob"><label>BPM B</label><input type="range" id="bpmB" min="60" max="200" value="120"><div class="val" id="bpmBVal">120</div></div>
      <div class="knob"><label>Low</label><input type="range" id="eqLowB" min="-20" max="20" value="0"><div class="val" id="eqLowBVal">0</div></div>
      <div class="knob"><label>Mid</label><input type="range" id="eqMidB" min="-20" max="20" value="0"><div class="val" id="eqMidBVal">0</div></div>
      <div class="knob"><label>High</label><input type="range" id="eqHighB" min="-20" max="20" value="0"><div class="val" id="eqHighBVal">0</div></div>
    </div>
  </div>

  <!-- MASTER -->
  <div class="master">
    <div class="xf-row">
      <span>A</span>
      <input type="range" id="xf" min="0" max="100" value="50">
      <span>B</span>
    </div>
    <div class="knob-row">
      <div class="knob"><label>Master Vol</label><input type="range" id="masterVol" min="0" max="100" value="80"><div class="val" id="masterVolVal">80</div></div>
      <div class="knob"><label>Master BPM</label><input type="range" id="masterBpm" min="60" max="200" value="120"><div class="val" id="masterBpmVal">120</div></div>
    </div>
  </div>

  <div class="bar">
    <label class="btn" for="fileA">♪ Müzik A</label>
    <input type="file" id="fileA" accept="audio/*">
    <label class="btn" for="fileB">♪ Müzik B</label>
    <input type="file" id="fileB" accept="audio/*">
    <button class="btn rec" id="recBtn">● Ses Kaydet</button>
    <button class="btn stop" id="stopAll">■ Durdur</button>
  </div>

</div>

<script>
/* ================= SES MOTORU ================= */
let audioCtx=null, masterGain=null, masterComp=null, recDest=null;
let deckNodes = {A:null, B:null};
let decks = {
  A:{buffer:null,name:'',playing:false,startTime:0,offset:0,rate:1,
     bpm:120,origBpm:120,loop:false,loopStart:0,loopEnd:0,
     vol:1,eqLow:0,eqMid:0,eqHigh:0,src:null,gain:null,eqL:null,eqM:null,eqH:null},
  B:{buffer:null,name:'',playing:false,startTime:0,offset:0,rate:1,
     bpm:120,origBpm:120,loop:false,loopStart:0,loopEnd:0,
     vol:1,eqLow:0,eqMid:0,eqHigh:0,src:null,gain:null,eqL:null,eqM:null,eqH:null}
};
let recorder=null, recChunks=[];
let animId=null;

const statusEl=document.getElementById('status');

function setStatus(msg){statusEl.textContent=msg;console.log('[STATUS]',msg)}

/* Ses motoru — ilk kullanıcı tıklamasında kurulur */
function ensureAudio(){
  if(audioCtx) return true;
  try{
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = +document.getElementById('masterVol').value/100;
    masterComp = audioCtx.createDynamicsCompressor();
    masterComp.threshold.value=-12;
    masterComp.ratio.value=4;
    masterGain.connect(masterComp);
    masterComp.connect(audioCtx.destination);
    recDest = audioCtx.createMediaStreamDestination();
    masterComp.connect(recDest);

    // her deck için zincir: src → eqL → eqM → eqH → gain → masterGain
    ['A','B'].forEach(k=>{
      const d=decks[k];
      d.eqL=audioCtx.createBiquadFilter();d.eqL.type='lowshelf';d.eqL.frequency.value=200;
      d.eqM=audioCtx.createBiquadFilter();d.eqM.type='peaking';d.eqM.frequency.value=1000;d.eqM.Q.value=1;
      d.eqH=audioCtx.createBiquadFilter();d.eqH.type='highshelf';d.eqH.frequency.value=4000;
      d.gain=audioCtx.createGain();
      d.gain.gain.value = d.vol * 0.5;
      d.eqL.connect(d.eqM);d.eqM.connect(d.eqH);d.eqH.connect(d.gain);
      d.gain.connect(masterGain);
    });
    applyXfade();
    return true;
  }catch(e){
    setStatus('Ses motoru başlatılamadı: '+e.message);
    return false;
  }
}

/* Crossfader: A↔B */
function applyXfade(){
  if(!audioCtx||!decks.A.gain||!decks.B.gain)return;
  const x=+document.getElementById('xf').value/100;
  // equal power crossfade
  decks.A.gain.gain.value = decks.A.vol * Math.cos(x*Math.PI/2) * 0.6;
  decks.B.gain.gain.value = decks.B.vol * Math.cos((1-x)*Math.PI/2) * 0.6;
}

/* ================= BPM ALGILAMA ================= */
function detectBPM(buffer){
  try{
    const data=buffer.getChannelData(0);
    const sr=buffer.sampleRate;
    const win=Math.floor(sr*0.01);
    const peaks=[];let prev=0;
    // sadece ilk 60 saniyeye bak (hız için)
    const maxLen=Math.min(data.length, sr*60);
    for(let i=0;i<maxLen-win;i+=win){
      let sum=0;
      for(let j=0;j<win;j++)sum+=Math.abs(data[i+j]);
      const e=sum/win;
      if(e>prev*1.4 && e>0.02)peaks.push(i/sr);
      prev=e;
    }
    if(peaks.length<8)return 120;
    const diffs=[];
    for(let i=1;i<peaks.length;i++){
      const d=peaks[i]-peaks[i-1];
      if(d>0.25&&d<1.5)diffs.push(d);
    }
    if(!diffs.length)return 120;
    diffs.sort((a,b)=>a-b);
    // medyan
    const med=diffs[Math.floor(diffs.length/2)];
    let bpm=60/med;
    while(bpm<70)bpm*=2;
    while(bpm>190)bpm/=2;
    return Math.round(bpm);
  }catch(e){return 120}
}

/* ================= DECK İŞLEMLERİ ================= */
function loadDeck(k, file){
  if(!ensureAudio())return;
  setStatus(`Deck ${k}: ${file.name} çözülüyor...`);
  file.arrayBuffer().then(arr=>audioCtx.decodeAudioData(arr))
    .then(buf=>{
      const d=decks[k];
      stopDeck(k,true);
      d.buffer=buf;
      d.name=file.name;
      d.offset=0;
      d.playing=false;
      d.origBpm=detectBPM(buf);
      d.bpm=d.origBpm;
      d.loopStart=0;
      d.loopEnd=buf.duration;
      d.loop=false;
      // UI güncelle
      document.getElementById('name'+k).textContent=file.name.slice(0,22);
      document.getElementById('info'+k).textContent=`${d.origBpm} BPM · ${buf.duration.toFixed(1)}s`;
      document.getElementById('bpm'+k).value=d.origBpm;
      document.getElementById('bpm'+k+'Val').textContent=d.origBpm;
      drawWave(k);
      setStatus(`Deck ${k} hazır: ${file.name.slice(0,20)} (${d.origBpm} BPM)`);
    })
    .catch(err=>{
      setStatus(`Deck ${k} HATA: ${err.message||'çözülemedi'} — farklı format dene (mp3/wav)`);
    });
}

function playDeck(k){
  if(!ensureAudio())return;
  const d=decks[k];
  if(!d.buffer){setStatus(`Deck ${k} boş`);return}
  if(audioCtx.state==='suspended')audioCtx.resume();
  if(d.playing)return;

  const src=audioCtx.createBufferSource();
  src.buffer=d.buffer;
  src.playbackRate.value=d.rate;
  src.connect(d.eqL);

  const startAt = d.loop ? d.loopStart : d.offset;
  if(d.loop){
    src.loop=true;src.loopStart=d.loopStart;src.loopEnd=d.loopEnd;
    src.start(0,startAt);
  }else{
    src.start(0,startAt);
  }
  d.src=src;
  d.playing=true;
  d.startTime=audioCtx.currentTime;
  d.offset=startAt;

  src.onended=()=>{
    if(d.src===src && !d.loop){
      d.playing=false;
      d.offset=0;
      document.getElementById('play'+k).classList.remove('on');
    }
  };
  document.getElementById('play'+k).classList.add('on');
  document.getElementById('play'+k).textContent='❚❚ Duraklat';
  startPlayheadLoop();
}

function stopDeck(k, silent){
  const d=decks[k];
  if(d.src){
    try{
      // offset kaydet
      if(d.playing && !d.loop){
        const elapsed=(audioCtx.currentTime-d.startTime)*d.rate;
        d.offset=Math.min(d.buffer.duration, d.offset+elapsed);
      }
      d.src.stop();
    }catch(e){}
    d.src=null;
  }
  d.playing=false;
  document.getElementById('play'+k).classList.remove('on');
  document.getElementById('play'+k).textContent='▶ Çal';
  if(!silent)setStatus(`Deck ${k} durdu`);
}

function togglePlay(k){
  const d=decks[k];
  if(d.playing)stopDeck(k);
  else playDeck(k);
}

/* ================= PLAYHEAD / WAVEFORM ================= */
function drawWave(k){
  const d=decks[k];
  const canvas=document.getElementById('wave'+k);
  const wrap=canvas.parentElement;
  const W=wrap.clientWidth, H=wrap.clientHeight;
  canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
  const ctx=canvas.getContext('2d');
  ctx.scale(devicePixelRatio,devicePixelRatio);
  ctx.clearRect(0,0,W,H);
  if(!d.buffer)return;
  const data=d.buffer.getChannelData(0);
  const step=Math.floor(data.length/W);
  const mid=H/2;
  ctx.fillStyle = k==='A' ? 'rgba(122,122,255,.7)' : 'rgba(255,122,212,.7)';
  for(let x=0;x<W;x++){
    let min=1,max=-1;
    for(let j=0;j<step;j++){
      const v=data[x*step+j];
      if(v<min)min=v;if(v>max)max=v;
    }
    const y1=mid+min*mid*0.9;
    const y2=mid+max*mid*0.9;
    ctx.fillRect(x,y1,1,y2-y1||1);
  }
}

let rafId=null;
function startPlayheadLoop(){
  if(rafId)return;
  const loop=()=>{
    ['A','B'].forEach(k=>{
      const d=decks[k];
      const ph=document.getElementById('ph'+k);
      if(!d.buffer||!d.playing){ph.style.left='0%';return}
      let pos;
      if(d.loop){
        const elapsed=(audioCtx.currentTime-d.startTime)*d.rate;
        pos=d.loopStart+elapsed;
        // loop içinde mod
        const len=d.loopEnd-d.loopStart;
        pos=d.loopStart+((pos-d.loopStart)%len);
      }else{
        const elapsed=(audioCtx.currentTime-d.startTime)*d.rate;
        pos=d.offset+elapsed;
      }
      const pct=Math.min(100,(pos/d.buffer.duration)*100);
      ph.style.left=pct+'%';
    });
    rafId=requestAnimationFrame(loop);
  };
  loop();
}

/* ================= UI BAĞLANTILARI ================= */
document.getElementById('fileA').addEventListener('change',e=>{
  const f=e.target.files[0];if(f)loadDeck('A',f);e.target.value='';
});
document.getElementById('fileB').addEventListener('change',e=>{
  const f=e.target.files[0];if(f)loadDeck('B',f);e.target.value='';
});

['A','B'].forEach(k=>{
  document.getElementById('play'+k).addEventListener('click',()=>togglePlay(k));
  document.getElementById('reset'+k).addEventListener('click',()=>{
    const d=decks[k];if(!d.buffer)return;
    stopDeck(k,true);d.offset=0;setStatus(`Deck ${k} başa alındı`);
  });
  document.getElementById('half'+k).addEventListener('click',()=>{
    const d=decks[k];if(!d.buffer)return;
    d.rate=Math.max(0.25,d.rate*0.5);
    if(d.src)d.src.playbackRate.value=d.rate;
    setStatus(`Deck ${k} hız: ${d.rate.toFixed(2)}×`);
  });
  document.getElementById('double'+k).addEventListener('click',()=>{
    const d=decks[k];if(!d.buffer)return;
    d.rate=Math.min(4,d.rate*2);
    if(d.src)d.src.playbackRate.value=d.rate;
    setStatus(`Deck ${k} hız: ${d.rate.toFixed(2)}×`);
  });
  document.getElementById('loopBtn'+k).addEventListener('click',function(){
    const d=decks[k];if(!d.buffer)return;
    d.loop=!d.loop;
    this.classList.toggle('on',d.loop);
    const reg=document.getElementById('loop'+k);
    if(d.loop){
      // basit loop: tüm parça döngü
      d.loopStart=0;d.loopEnd=d.buffer.duration;
      reg.style.display='block';reg.style.left='0%';reg.style.width='100%';
      setStatus(`Deck ${k} loop açık (tüm parça)`);
    }else{
      reg.style.display='none';
      setStatus(`Deck ${k} loop kapalı`);
    }
  });
  // vol
  document.getElementById('vol'+k).addEventListener('input',e=>{
    const d=decks[k];d.vol=+e.target.value/100;
    document.getElementById('vol'+k+'Val').textContent=e.target.value;
    applyXfade();
  });
  // bpm (playbackRate)
  document.getElementById('bpm'+k).addEventListener('input',e=>{
    const d=decks[k];if(!d.buffer)return;
    const newBpm=+e.target.value;
    d.rate=newBpm/d.origBpm;
    if(d.src)d.src.playbackRate.value=d.rate;
    document.getElementById('bpm'+k+'Val').textContent=newBpm;
  });
  // EQ
  ['Low','Mid','High'].forEach(band=>{
    document.getElementById('eq'+band+k).addEventListener('input',e=>{
      const v=+e.target.value;
      document.getElementById('eq'+band+k+'Val').textContent=v;
      const d=decks[k];
      if(band==='Low')d.eqL.gain.value=v;
      if(band==='Mid')d.eqM.gain.value=v;
      if(band==='High')d.eqH.gain.value=v;
    });
  });
});

/* master */
document.getElementById('xf').addEventListener('input',applyXfade);
document.getElementById('masterVol').addEventListener('input',e=>{
  document.getElementById('masterVolVal').textContent=e.target.value;
  if(masterGain)masterGain.gain.value=+e.target.value/100;
});
document.getElementById('masterBpm').addEventListener('input',e=>{
  document.getElementById('masterBpmVal').textContent=e.target.value;
  // her iki deck'i master BPM'e uydur
  ['A','B'].forEach(k=>{
    const d=decks[k];if(!d.buffer||!d.origBpm)return;
    d.rate=+e.target.value/d.origBpm;
    if(d.src)d.src.playbackRate.value=d.rate;
    document.getElementById('bpm'+k).value=+e.target.value;
    document.getElementById('bpm'+k+'Val').textContent=e.target.value;
  });
});

/* stop all */
document.getElementById('stopAll').addEventListener('click',()=>{
  stopDeck('A',true);stopDeck('B',true);
  if(recorder){recorder.stop()}
  setStatus('Durduruldu');
});

/* kayıt */
document.getElementById('recBtn').addEventListener('click',async function(){
  if(!ensureAudio())return;
  if(audioCtx.state==='suspended')await audioCtx.resume();
  if(recorder){
    recorder.stop();return;
  }
  recChunks=[];
  const mime=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/ogg';
  try{
    recorder=new MediaRecorder(recDest.stream,{mimeType:mime});
  }catch(e){
    setStatus('Kayıt desteklenmiyor: '+e.message);return;
  }
  recorder.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data)};
  recorder.onstop=()=>{
    const blob=new Blob(recChunks,{type:mime});
    downloadBlob(blob,'mashup_'+Date.now()+(mime.includes('webm')?'.webm':'.ogg'));
    recorder=null;this.classList.remove('on');this.textContent='● Ses Kaydet';
    setStatus('Kayıt indirildi');
  };
  recorder.start();
  this.classList.add('on');this.textContent='⏹ Kaydı Bitir';
  setStatus('Kayıt başladı — mashup yap');
});

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

/* tam ekran */
document.getElementById('fsBtn').addEventListener('click',()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch(()=>{});
  }else{
    (document.exitFullscreen||document.webkitExitFullscreen).call(document).catch(()=>{});
  }
});

/* çift dokunma zoom engeli */
let lastTouch=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouch<300)e.preventDefault();
  lastTouch=now;
},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());

/* resize → waveform yeniden çiz */
let resizeT=null;
window.addEventListener('resize',()=>{
  clearTimeout(resizeT);
  resizeT=setTimeout(()=>{drawWave('A');drawWave('B')},200);
});

setStatus('Hazır — iki müzik yükle');
</script>
