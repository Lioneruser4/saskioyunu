<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FullSongBot 🎵</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 40px;
            max-width: 850px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #fff;
            font-size: 3em;
            font-weight: 800;
            background: linear-gradient(135deg, #f093fb, #f5576c, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #a0aec0;
            font-size: 1.05em;
        }

        .welcome-section {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.15), rgba(245, 87, 108, 0.15));
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(79, 172, 254, 0.2);
            display: none;
        }

        .welcome-section.active {
            display: block;
        }

        .welcome-section .greeting {
            color: #e2e8f0;
            font-size: 1.2em;
            font-weight: 600;
        }

        .welcome-section .greeting span {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-section .user-id {
            color: #718096;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .user-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-section label {
            color: #e2e8f0;
            font-weight: 600;
            font-size: 0.9em;
            display: block;
            margin-bottom: 5px;
        }

        .user-section input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1em;
            transition: all 0.3s;
        }

        .user-section input:focus {
            outline: none;
            border-color: #4facfe;
            background: rgba(255, 255, 255, 0.08);
        }

        .user-section input:disabled {
            opacity: 0.5;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 16px 20px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1.05em;
            transition: all 0.3s;
        }

        .search-box input::placeholder {
            color: #718096;
        }

        .search-box input:focus {
            outline: none;
            border-color: #4facfe;
            background: rgba(255, 255, 255, 0.08);
        }

        .search-box button {
            padding: 16px 35px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            font-size: 1.05em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .search-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 35px rgba(245, 87, 108, 0.4);
        }

        .search-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 25px;
            color: #a0aec0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.05);
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .results.active {
            display: grid;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            cursor: pointer;
            text-align: center;
        }

        .result-item:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(79, 172, 254, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .result-item img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .result-item .title {
            color: #e2e8f0;
            font-weight: 600;
            font-size: 0.9em;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .result-item .duration {
            color: #718096;
            font-size: 0.8em;
            margin-top: 5px;
        }

        .result-item .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7em;
            font-weight: 700;
            margin-top: 5px;
        }

        .badge.audio {
            background: rgba(79, 172, 254, 0.2);
            color: #4facfe;
        }

        .badge.video {
            background: rgba(245, 87, 108, 0.2);
            color: #f5576c;
        }

        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            padding: 18px 30px;
            border-radius: 16px;
            color: #fff;
            font-weight: 600;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 999;
            max-width: 400px;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .notification.success {
            border-color: #4facfe;
        }

        .notification.error {
            border-color: #f5576c;
        }

        .notification.info {
            border-color: #f093fb;
        }

        .bot-status {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #718096;
            font-size: 0.85em;
        }

        .bot-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4facfe;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }

            .results {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎵 FullSongBot</h1>
            <p>YouTube'da ara, seç, bot ile al!</p>
        </div>

        <div class="welcome-section" id="welcomeSection">
            <div class="greeting">👋 Hoşgeldin, <span id="userName">İsim</span>!</div>
            <div class="user-id">🆔 ID: <span id="userIdDisplay">-</span></div>
        </div>

        <div class="user-section">
            <label>👤 Telegram User ID</label>
            <input type="text" id="userId" placeholder="Otomatik algılanıyor..." disabled>
            <small style="color: #718096; display: block; margin-top: 5px;">✅ WebView üzerinden otomatik algılandı</small>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🎤 Şarkı veya video ara...">
            <button onclick="searchMusic()" id="searchBtn">🔍 Ara</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>🔎 YouTube'da aranıyor...</p>
        </div>

        <div class="results" id="results"></div>

        <div class="bot-status">
            <span class="dot"></span>
            <span>Bot aktif • @FullSongBot</span>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // ⚠️ RENDER URL'Nİ BURAYA YAZ
        const BOT_API_URL = 'https://fullsongbot.onrender.com';

        let telegramUser = null;

        function initTelegramUser() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    const webApp = window.Telegram.WebApp;
                    const user = webApp.initDataUnsafe?.user;

                    if (user) {
                        telegramUser = {
                            id: user.id,
                            firstName: user.first_name || 'Kullanıcı',
                            lastName: user.last_name || '',
                            username: user.username || ''
                        };

                        document.getElementById('userId').value = telegramUser.id;
                        document.getElementById('userIdDisplay').textContent = telegramUser.id;

                        const fullName = telegramUser.firstName + (telegramUser.lastName ? ' ' + telegramUser.lastName : '');
                        document.getElementById('userName').textContent = fullName;

                        document.getElementById('welcomeSection').classList.add('active');
                        showNotification(`🎵 Hoşgeldin ${fullName}!`, 'info');

                        webApp.expand();
                        return true;
                    }
                }

                document.getElementById('userId').disabled = false;
                document.getElementById('userId').placeholder = 'Telegram ID\'nizi girin';
                return false;

            } catch (error) {
                console.error('Telegram hatası:', error);
                return false;
            }
        }

        async function searchMusic() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                showNotification('Lütfen bir şarkı adı yazın!', 'error');
                return;
            }

            let userId = document.getElementById('userId').value.trim();
            if (!userId) {
                const manualId = prompt('Telegram ID\'nizi girin:');
                if (manualId) {
                    userId = manualId;
                    document.getElementById('userId').value = userId;
                } else {
                    showNotification('Lütfen Telegram ID\'nizi girin!', 'error');
                    return;
                }
            }

            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            document.getElementById('results').innerHTML = '';
            document.getElementById('searchBtn').disabled = true;

            try {
                const response = await fetch(`${BOT_API_URL}/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                document.getElementById('loading').classList.remove('active');
                document.getElementById('searchBtn').disabled = false;

                if (data.error) {
                    showNotification('Hata: ' + data.error, 'error');
                    return;
                }

                if (data.results && data.results.length > 0) {
                    showResults(data.results, userId);
                } else {
                    showNotification('Sonuç bulunamadı!', 'error');
                }
            } catch (error) {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('searchBtn').disabled = false;
                showNotification('Bağlantı hatası! Bot çalışmıyor olabilir.', 'error');
                console.error('Hata:', error);
            }
        }

        function showResults(results, userId) {
            const container = document.getElementById('results');
            container.innerHTML = '';
            container.classList.add('active');

            results.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'result-item';
                div.innerHTML = `
                            <img src="${item.thumbnail}" alt="${item.title}">
                            <div class="title">${item.title}</div>
                            <div class="duration">⏱ ${item.duration}</div>
                            <div class="badge ${item.type}">${item.type === 'audio' ? '🎵 Müzik' : '🎬 Video'}</div>
                        `;
                div.onclick = () => sendToBot(item, userId);
                container.appendChild(div);
            });
        }

        async function sendToBot(item, userId) {
            showNotification('📤 Bot\'a gönderiliyor...', 'info');

            try {
                const response = await fetch(`${BOT_API_URL}/send`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        url: item.url,
                        title: item.title,
                        type: item.type
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showNotification('✅ Şarkı Telegram\'a gönderildi!', 'success');
                } else {
                    showNotification('❌ Hata: ' + data.error, 'error');
                }
            } catch (error) {
                showNotification('❌ Bağlantı hatası!', 'error');
                console.error('Hata:', error);
            }
        }

        function showNotification(message, type) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = 'notification show ' + type;
            clearTimeout(notif._timeout);
            notif._timeout = setTimeout(() => {
                notif.className = 'notification';
            }, 5000);
        }

        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchMusic();
        });

        document.addEventListener('DOMContentLoaded', function() {
            initTelegramUser();
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
            }
        });
    </script>

</body>
</html>
