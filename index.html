<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Launchpad</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(circle at 50% 0%,#1b1b2a,#0a0a0f 70%);color:#eee;
    font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;
    flex-direction:column;align-items:center;padding:12px;gap:12px;overflow-x:hidden}
  h1{font-size:1rem;letter-spacing:4px;color:#7a7a9a;font-weight:600;margin-top:6px}
  #videoWrap{width:100%;max-width:520px;aspect-ratio:16/9;background:#000;border-radius:12px;
    overflow:hidden;position:relative;box-shadow:0 8px 30px rgba(0,0,0,.7);display:none}
  #videoWrap video{width:100%;height:100%;object-fit:cover}
  #grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;width:100%;max-width:520px;
    padding:10px;background:#14141e;border-radius:14px;box-shadow:inset 0 0 0 1px #26263a,0 10px 40px rgba(0,0,0,.6)}
  .pad{aspect-ratio:1;border-radius:7px;background:#23233a;cursor:pointer;position:relative;
    transition:transform .07s,background .2s,box-shadow .2s;overflow:hidden}
  .pad::after{content:"";position:absolute;inset:0;border-radius:7px;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.25),transparent 60%);opacity:0;transition:opacity .2s}
  .pad.on{box-shadow:0 0 14px currentColor,0 0 4px currentColor inset}
  .pad.on::after{opacity:1}
  .pad:active{transform:scale(.9)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px}
  button,label.filebtn{background:#2a2a44;color:#dcdcf0;border:none;padding:10px 14px;border-radius:9px;
    font-size:.8rem;cursor:pointer;transition:background .2s;display:inline-flex;align-items:center;gap:6px}
  button:hover,label.filebtn:hover{background:#3a3a5e}
  button.danger{background:#4a2230}button.danger:hover{background:#6a2e42}
  input[type=file]{display:none}
  #status{font-size:.72rem;color:#6a6a8a;text-align:center;min-height:16px;max-width:520px}
  .row{display:flex;gap:8px;align-items:center;font-size:.78rem;color:#9a9ab8}
  input[type=range]{width:90px;accent-color:#7a5cff}
  #volVal{min-width:28px;text-align:right}
</style>
</head>
<body>
  <h1>PRO LAUNCHPAD</h1>

  <div id="videoWrap"><video id="vid" muted playsinline></video></div>

  <div id="grid"></div>

  <div class="bar">
    <label class="filebtn">🎵 Müzik Yükle<input type="file" id="audioFile" accept="audio/*"></label>
    <label class="filebtn">🎬 Video Yükle<input type="file" id="videoFile" accept="video/*"></label>
    <button id="clearAll" class="danger">🗑️ Temizle</button>
  </div>

  <div class="row">
    <span>🔊</span><input type="range" id="vol" min="0" max="100" value="80"><span id="volVal">80</span>
  </div>

  <div id="status">Hazır. Müzik yükle, pad'lere bas.</div>

<script>
const GRID=64, COLS=8;
const gridEl=document.getElementById('grid');
const statusEl=document.getElementById('status');
const vidWrap=document.getElementById('videoWrap');
const vid=document.getElementById('vid');
const volEl=document.getElementById('vol');
const volVal=document.getElementById('volVal');

let audioCtx, masterGain, analyser;
let buffer=null;          // decoded audio
let pads=[];              // {el, src, gain, active, color}
let videoURL=null, audioURL=null;

// ---- IndexedDB ----
const DB='launchpadDB', STORE='files';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=e=>e.target.result.createObjectStore(STORE);
  r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e)})}
async function dbPut(k,blob){const db=await openDB();return new Promise((res,rej)=>{
  const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(blob,k);
  tx.oncomplete=()=>res();tx.onerror=e=>rej(e)})}
async function dbGet(k){const db=await openDB();return new Promise((res,rej)=>{
  const tx=db.transaction(STORE,'readonly');const rq=tx.objectStore(STORE).get(k);
  rq.onsuccess=()=>res(rq.result);rq.onerror=e=>rej(e)})}
async function dbDel(k){const db=await openDB();return new Promise((res,rej)=>{
  const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(k);
  tx.oncomplete=()=>res();tx.onerror=e=>rej(e)})}

// ---- Audio engine ----
function initAudio(){
  if(audioCtx)return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=volEl.value/100;
  masterGain.connect(audioCtx.destination);
}

// pad rengi: HSV döngü
function padColor(i){
  const h=(i/GRID)*360;
  return `hsl(${h},75%,55%)`;
}

// grid oluştur
for(let i=0;i<GRID;i++){
  const el=document.createElement('div');
  el.className='pad';
  const c=padColor(i);
  el.style.background='#23233a';
  el.style.color=c;
  el.dataset.i=i;
  gridEl.appendChild(el);
  pads.push({el,src:null,gain:null,active:false,color:c});
}

// pad tıklama
gridEl.addEventListener('pointerdown',e=>{
  const p=e.target.closest('.pad');if(!p)return;
  const i=+p.dataset.i;
  togglePad(i);
});

function togglePad(i){
  if(!buffer){statusEl.textContent='Önce müzik yükle 🎵';return;}
  initAudio();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const pad=pads[i];
  if(pad.active){
    // durdur
    try{pad.src.stop();}catch(e){}
    pad.active=false;
    pad.el.classList.remove('on');
    pad.el.style.background='#23233a';
    syncVideo();
    return;
  }
  // her pad müziğin bir dilimini döngüde çalar
  const dur=buffer.duration;
  const slice=dur/GRID;
  const offset=(i*slice)%dur;
  const src=audioCtx.createBufferSource();
  src.buffer=buffer;
  src.loop=true;
  src.loopStart=offset;
  src.loopEnd=Math.min(dur,offset+slice);
  const g=audioCtx.createGain();g.gain.value=1;
  src.connect(g);g.connect(masterGain);
  src.start(0,offset);
  pad.src=src;pad.gain=g;pad.active=true;
  pad.el.classList.add('on');
  pad.el.style.background=pad.color;
  syncVideo();
}

// video: hangi pad açıksa o dilimi göster
function syncVideo(){
  if(!vid.src)return;
  const active=pads.find(p=>p.active);
  if(!active){vid.pause();return;}
  if(!buffer||!vid.duration)return;
  const i=+active.el.dataset.i;
  const dur=vid.duration;
  const slice=dur/GRID;
  const t=(i*slice)%dur;
  vid.currentTime=t;
  vid.play().catch(()=>{});
}

// ses seviyesi
volEl.addEventListener('input',()=>{
  volVal.textContent=volEl.value;
  if(masterGain)masterGain.gain.value=volEl.value/100;
});

// ---- Dosya yükleme ----
document.getElementById('audioFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  initAudio();
  statusEl.textContent='Müzik çözülüyor...';
  const arr=await f.arrayBuffer();
  buffer=await audioCtx.decodeAudioData(arr);
  await dbPut('audio',f);
  statusEl.textContent=`Müzik yüklendi: ${f.name} (${buffer.duration.toFixed(1)}s)`;
  e.target.value='';
});

document.getElementById('videoFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  if(videoURL)URL.revokeObjectURL(videoURL);
  videoURL=URL.createObjectURL(f);
  vid.src=videoURL;
  vid.muted=true;              // videonun kendi sesi kapalı
  vidWrap.style.display='block';
  await dbPut('video',f);
  statusEl.textContent=`Video yüklendi: ${f.name} (sesi kapalı)`;
  e.target.value='';
  vid.onloadedmetadata=()=>syncVideo();
});

// temizle
document.getElementById('clearAll').addEventListener('click',async()=>{
  pads.forEach(p=>{if(p.active){try{p.src.stop()}catch(e){}}
    p.active=false;p.el.classList.remove('on');p.el.style.background='#23233a'});
  buffer=null;
  vid.pause();vid.removeAttribute('src');vidWrap.style.display='none';
  await dbDel('audio');await dbDel('video');
  statusEl.textContent='Temizlendi.';
});

// ---- Açılışta hafızadan yükle ----
(async()=>{
  try{
    const a=await dbGet('audio');
    if(a){
      initAudio();
      const arr=await a.arrayBuffer();
      buffer=await audioCtx.decodeAudioData(arr);
      statusEl.textContent='Kayıtlı müzik yüklendi.';
    }
    const v=await dbGet('video');
    if(v){
      videoURL=URL.createObjectURL(v);
      vid.src=videoURL;vid.muted=true;vidWrap.style.display='block';
      vid.onloadedmetadata=()=>syncVideo();
    }
  }catch(err){console.warn(err)}
})();

// klavye (PC)
const keyMap={};
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key.toLowerCase();
  if(k>='1'&&k<='8'){const n=+k-1;togglePad(n);}
});
</script>
</body>
</html>
