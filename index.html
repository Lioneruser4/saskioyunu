<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Backrooms · The Pursuit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b0e14; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #f0eae1;
            font-size: 18px;
            text-shadow: 2px 2px 0 #1a1f2a;
            pointer-events: none;
            z-index: 10;
            background: rgba(10, 14, 23, 0.6);
            padding: 12px 22px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid #4a5268;
            display: flex;
            gap: 28px;
            letter-spacing: 0.5px;
        }
        #ui span { color: #b9d0ff; font-weight: 600; }
        #lobby {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #141a24;
            z-index: 30;
            transition: opacity 0.25s;
            backdrop-filter: blur(3px);
        }
        #lobby.hidden { opacity: 0; pointer-events: none; }
        #lobby h1 {
            font-size: clamp(2.8rem, 12vw, 6rem);
            color: #e8edf5;
            text-shadow: 0 0 20px #3f5f8f;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }
        #lobby p {
            color: #afbed9;
            font-size: 1.3rem;
            margin-bottom: 36px;
            opacity: 0.8;
        }
        #lobby button {
            background: #2d3f5e;
            border: none;
            color: white;
            font-size: 1.8rem;
            padding: 18px 52px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 0 #0e1724;
            transition: all 0.08s linear;
            font-weight: 600;
            letter-spacing: 1px;
            border: 1px solid #6a7faa;
        }
        #lobby button:active { transform: translateY(6px); box-shadow: 0 2px 0 #0e1724; }
        #lobby .sub {
            margin-top: 40px;
            font-size: 1rem;
            color: #6f7e9e;
        }
        #controls-mobile {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            pointer-events: none;
            z-index: 20;
        }
        #controls-mobile button {
            pointer-events: auto;
            background: rgba(30, 40, 60, 0.7);
            backdrop-filter: blur(6px);
            border: 1px solid #5a6b8c;
            color: white;
            font-size: 2rem;
            padding: 18px 28px;
            border-radius: 60px;
            box-shadow: 0 6px 0 #0f1622;
            transition: 0.05s linear;
            font-weight: bold;
            min-width: 100px;
        }
        #controls-mobile button:active { transform: scale(0.92); background: #3d5277; }
        @media (min-width: 800px) { #controls-mobile { display: none; } }
        #death-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 40;
            flex-direction: column;
            color: white;
        }
        #death-overlay.show { display: flex; }
        #death-overlay h2 { font-size: 4rem; color: #d66; text-shadow: 0 0 30px #a33; }
        #death-overlay p { margin: 20px 0 30px; font-size: 1.4rem; opacity: 0.7; }
        #death-overlay button { background: #3a4a6a; border: none; color: white; font-size: 1.8rem; padding: 14px 50px; border-radius: 60px; cursor: pointer; border: 1px solid #7a8aaa; }
    </style>
</head>
<body>
    <!-- LOBBY -->
    <div id="lobby">
        <h1>⬡ BACKROOMS</h1>
        <p>kaçış · anahtarı bul · kapıdan geç</p>
        <button id="startBtn">▶ OYNA</button>
        <div class="sub">[ PC: WASD + SHIFT koş | Mobile: sol/sağ butonlar ]</div>
    </div>

    <!-- DEATH -->
    <div id="death-overlay">
        <h2>☠ YAKALANDIN</h2>
        <p>canavar seni buldu...</p>
        <button id="respawnBtn">⟳ LOBIYE DÖN</button>
    </div>

    <!-- OYUN -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI -->
    <div id="ui">
        <div>🏃 <span id="statusText">kaçış</span></div>
        <div>🔑 <span id="keyStatus">✕</span></div>
    </div>

    <!-- MOBIL KONTROLLER -->
    <div id="controls-mobile">
        <button id="btnLeft">◀</button>
        <button id="btnRight">▶</button>
    </div>

    <script>
        (function(){
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // UI elemanları
            const lobbyEl = document.getElementById('lobby');
            const deathOverlay = document.getElementById('death-overlay');
            const statusText = document.getElementById('statusText');
            const keyStatus = document.getElementById('keyStatus');

            // --- BOYUT ---
            let W, H;
            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // --- FPS / mobi kontrol ---
            const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
            const mobileControls = document.getElementById('controls-mobile');
            if (isMobile) mobileControls.style.display = 'flex';
            else mobileControls.style.display = 'none';

            // --- OYUN DURUMU ---
            let gameActive = false;
            let player = { x: 0, y: 0, radius: 14, speed: 3.2, sprint: 5.8 };
            let keys = { w: false, a: false, s: false, d: false, shift: false };
            let monster = { x: 0, y: 0, speed: 1.2 };
            let keyItem = { x: 0, y: 0, collected: false };
            let door = { x: 0, y: 0 };
            let world = { walls: [] }; // dikdörtgen duvarlar [x,y,w,h]

            // canavar arama hedefi (player)
            let monsterTarget = { x: 0, y: 0 };

            // canavar vurma (öldürme) cooldown
            let attackCooldown = 0;

            // --- LABİRENT OLUŞTUR ---
            function generateMaze() {
                // labirent: backrooms hissi, ortada boş alan, çok geçit
                const wWalls = [];
                const size = 580; // labirent boyutu
                const offsetX = (W - size) / 2;
                const offsetY = (H - size) / 2;

                // dış duvarlar
                wWalls.push([offsetX, offsetY, size, 12]); // üst
                wWalls.push([offsetX, offsetY + size - 12, size, 12]); // alt
                wWalls.push([offsetX, offsetY, 12, size]); // sol
                wWalls.push([offsetX + size - 12, offsetY, 12, size]); // sağ

                // iç duvarlar (kaotik backrooms)
                const segments = [
                    [120, 80, 8, 200], [200, 60, 180, 8], [120, 280, 200, 8], [320, 120, 8, 180],
                    [60, 200, 100, 8], [400, 60, 8, 200], [60, 380, 180, 8], [260, 380, 8, 120],
                    [420, 280, 8, 180], [200, 460, 200, 8], [60, 480, 100, 8], [440, 200, 8, 180],
                    [140, 140, 8, 60], [320, 340, 120, 8], [420, 420, 80, 8], [60, 140, 100, 8],
                    [480, 60, 8, 140], [200, 220, 120, 8], [340, 220, 8, 100], [80, 360, 60, 8],
                    [480, 240, 8, 100], [280, 480, 100, 8], [440, 100, 8, 80]
                ];
                segments.forEach(s => {
                    // ofset ekle
                    wWalls.push([s[0] + offsetX, s[1] + offsetY, s[2], s[3]]);
                });

                // ortada boş alan (biraz daha açık) — ama yine de duvar ekleyelim
                wWalls.push([offsetX + 240, offsetY + 200, 8, 120]);
                wWalls.push([offsetX + 320, offsetY + 200, 8, 120]);
                wWalls.push([offsetX + 200, offsetY + 300, 160, 8]);

                // ekstra dağınıklık
                for (let i = 0; i < 40; i++) {
                    let rx = offsetX + 30 + Math.random() * (size - 60);
                    let ry = offsetY + 30 + Math.random() * (size - 60);
                    let rw = 6 + Math.random() * 14;
                    let rh = 6 + Math.random() * 14;
                    if (Math.random() > 0.6) wWalls.push([rx, ry, rw, rh]);
                }

                return wWalls.map(w => ({ x: w[0], y: w[1], w: w[2], h: w[3] }));
            }

            // --- YERLEŞTİRME (player, monster, key, door) ---
            function placeEntities(walls) {
                const margin = 50;
                const attempts = 300;
                let p, m, k, d;

                function randomPos() {
                    let x = margin + Math.random() * (W - 2 * margin);
                    let y = margin + Math.random() * (H - 2 * margin);
                    return { x, y };
                }

                function isOverlappingWall(x, y, rad) {
                    for (let wall of walls) {
                        const cx = Math.max(wall.x, Math.min(x, wall.x + wall.w));
                        const cy = Math.max(wall.y, Math.min(y, wall.y + wall.h));
                        const dx = x - cx, dy = y - cy;
                        if (dx * dx + dy * dy < (rad + 6) * (rad + 6)) return true;
                    }
                    return false;
                }

                function findValidPos(rad = 16) {
                    for (let i = 0; i < attempts; i++) {
                        const pos = randomPos();
                        if (!isOverlappingWall(pos.x, pos.y, rad)) return pos;
                    }
                    return { x: W/2 + 40, y: H/2 + 40 };
                }

                p = findValidPos(18);
                m = findValidPos(20);
                k = findValidPos(12);
                d = findValidPos(18);

                // kapı random anahtardan uzak olsun
                let distKeyDoor = 0;
                for (let i = 0; i < 50; i++) {
                    const nd = findValidPos(18);
                    const dk = Math.hypot(nd.x - k.x, nd.y - k.y);
                    if (dk > 200 && dk < 500) {
                        d = nd;
                        break;
                    }
                }

                return { player: p, monster: m, key: k, door: d };
            }

            // --- OYUN BAŞLAT / YENİDEN ---
            function initGame() {
                // Duvarları oluştur
                world.walls = generateMaze();

                // Varlıkları yerleştir
                const entities = placeEntities(world.walls);
                player.x = entities.player.x;
                player.y = entities.player.y;
                monster.x = entities.monster.x;
                monster.y = entities.monster.y;
                keyItem.x = entities.key.x;
                keyItem.y = entities.key.y;
                keyItem.collected = false;
                door.x = entities.door.x;
                door.y = entities.door.y;

                // UI sıfırla
                keyStatus.textContent = '✕';
                statusText.textContent = 'kaçış';
                gameActive = true;
                attackCooldown = 0;
                deathOverlay.classList.remove('show');
                lobbyEl.classList.add('hidden');
            }

            // --- ÖLÜM ---
            function playerDeath() {
                gameActive = false;
                deathOverlay.classList.add('show');
            }

            // --- KAZANMA (kapıdan geçiş) ---
            function winGame() {
                gameActive = false;
                statusText.textContent = '✧ KAZANDIN ✧';
                setTimeout(() => {
                    lobbyEl.classList.remove('hidden');
                    gameActive = false;
                }, 800);
            }

            // --- FİZİK & ÇARPIŞMA ---
            function isCollidingWithWall(x, y, rad) {
                for (let wall of world.walls) {
                    const cx = Math.max(wall.x, Math.min(x, wall.x + wall.w));
                    const cy = Math.max(wall.y, Math.min(y, wall.y + wall.h));
                    const dx = x - cx, dy = y - cy;
                    if (dx * dx + dy * dy < (rad + 4) * (rad + 4)) return true;
                }
                return false;
            }

            function canMoveTo(x, y, rad) {
                return !isCollidingWithWall(x, y, rad);
            }

            // --- AI: canavar akıllı arama ---
            function updateMonster() {
                if (!gameActive) return;

                // hedef: player
                const dx = player.x - monster.x;
                const dy = player.y - monster.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 120) {
                    // yakın: doğrudan saldır
                    const angle = Math.atan2(dy, dx);
                    let nx = monster.x + Math.cos(angle) * monster.speed * 1.4;
                    let ny = monster.y + Math.sin(angle) * monster.speed * 1.4;
                    if (canMoveTo(nx, ny, 18)) {
                        monster.x = nx;
                        monster.y = ny;
                    } else {
                        // duvara takılma, yana kay
                        const altAngle = angle + (Math.random() - 0.5) * 0.9;
                        nx = monster.x + Math.cos(altAngle) * monster.speed * 1.2;
                        ny = monster.y + Math.sin(altAngle) * monster.speed * 1.2;
                        if (canMoveTo(nx, ny, 18)) { monster.x = nx; monster.y = ny; }
                    }
                } else {
                    // akıllı arama: insansı, keskin köşelerden kaçınarak
                    // hedefe doğru yönelim + random sapma
                    let angle = Math.atan2(dy, dx);
                    const noise = (Math.random() - 0.5) * 0.6;
                    angle += noise;
                    let nx = monster.x + Math.cos(angle) * monster.speed * 0.9;
                    let ny = monster.y + Math.sin(angle) * monster.speed * 0.9;
                    if (canMoveTo(nx, ny, 18)) {
                        monster.x = nx;
                        monster.y = ny;
                    } else {
                        // alternatif
                        for (let i = 0; i < 4; i++) {
                            const alt = angle + (i * 1.2 - 1.8);
                            nx = monster.x + Math.cos(alt) * monster.speed * 0.8;
                            ny = monster.y + Math.sin(alt) * monster.speed * 0.8;
                            if (canMoveTo(nx, ny, 18)) { monster.x = nx; monster.y = ny; break; }
                        }
                    }
                }

                // CANAVAR ÇARPMASI (oyuncuyu yakalarsa)
                if (Math.hypot(player.x - monster.x, player.y - monster.y) < 32) {
                    if (attackCooldown <= 0) {
                        playerDeath();
                        attackCooldown = 40;
                    }
                }
                if (attackCooldown > 0) attackCooldown--;
            }

            // --- OYUNCU GÜNCELLEME ---
            function updatePlayer(dt) {
                if (!gameActive) return;
                let moveX = 0, moveY = 0;
                if (keys.w) moveY -= 1;
                if (keys.s) moveY += 1;
                if (keys.a) moveX -= 1;
                if (keys.d) moveX += 1;

                if (moveX !== 0 || moveY !== 0) {
                    const len = Math.hypot(moveX, moveY);
                    moveX /= len;
                    moveY /= len;
                    const spd = keys.shift ? player.sprint : player.speed;
                    const newX = player.x + moveX * spd * dt * 60;
                    const newY = player.y + moveY * spd * dt * 60;

                    // ayrı ayrı kontrol (sürtünme)
                    if (canMoveTo(newX, player.y, player.radius)) player.x = newX;
                    if (canMoveTo(player.x, newY, player.radius)) player.y = newY;
                }

                // anahtar toplama
                if (!keyItem.collected) {
                    if (Math.hypot(player.x - keyItem.x, player.y - keyItem.y) < 28) {
                        keyItem.collected = true;
                        keyStatus.textContent = '✔';
                        statusText.textContent = 'anahtar var!';
                    }
                }

                // kapı kontrolü (anahtar varsa)
                if (keyItem.collected) {
                    if (Math.hypot(player.x - door.x, player.y - door.y) < 30) {
                        winGame();
                    }
                }
            }

            // --- ÇİZİM ---
            function draw() {
                ctx.clearRect(0, 0, W, H);
                // arkaplan backrooms
                const grad = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, 700);
                grad.addColorStop(0, '#2f3f4b');
                grad.addColorStop(1, '#10161e');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // duvarlar
                ctx.fillStyle = '#7b8b9c';
                ctx.shadowColor = '#1f2a33';
                ctx.shadowBlur = 18;
                for (let wall of world.walls) {
                    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                }
                ctx.shadowBlur = 0;

                // kapı (yeşil)
                ctx.fillStyle = '#4a7a5a';
                ctx.shadowBlur = 24;
                ctx.shadowColor = '#2d5a3a';
                ctx.beginPath();
                ctx.arc(door.x, door.y, 20, 0, Math.PI * 2);
                ctx.fill();
                if (keyItem.collected) {
                    ctx.fillStyle = '#b3ffb3';
                    ctx.beginPath();
                    ctx.arc(door.x, door.y, 14, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;

                // anahtar
                if (!keyItem.collected) {
                    ctx.fillStyle = '#f0d050';
                    ctx.shadowBlur = 34;
                    ctx.shadowColor = '#f0b030';
                    ctx.beginPath();
                    ctx.arc(keyItem.x, keyItem.y, 12, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#b38f30';
                    ctx.beginPath();
                    ctx.arc(keyItem.x - 2, keyItem.y - 3, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (keyItem.collected) {
                    // oyuncunun elinde anahtar (çiz)
                    ctx.fillStyle = '#f0d050';
                    ctx.beginPath();
                    ctx.arc(player.x + 18, player.y - 12, 8, 0, Math.PI * 2);
                    ctx.fill();
                }

                // oyuncu (beyaz insan)
                ctx.shadowBlur = 28;
                ctx.shadowColor = '#b0c8ff';
                ctx.fillStyle = '#f2f6ff';
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#d0daf0';
                ctx.beginPath();
                ctx.arc(player.x - 4, player.y - 6, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.arc(player.x + 4, player.y - 6, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#222';
                ctx.beginPath();
                ctx.arc(player.x - 5, player.y - 8, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.arc(player.x + 3, player.y - 8, 2, 0, Math.PI * 2);
                ctx.fill();
                // ağız
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 1.6;
                ctx.beginPath();
                ctx.arc(player.x, player.y + 2, 6, 0.1, Math.PI - 0.1);
                ctx.stroke();
                // bacak animasyonu (basit)
                const step = Date.now() / 140;
                if (keys.w || keys.s || keys.a || keys.d) {
                    ctx.fillStyle = '#d0daf0';
                    ctx.fillRect(player.x - 10, player.y + 12 + Math.sin(step)*3, 6, 8);
                    ctx.fillRect(player.x + 4, player.y + 12 + Math.sin(step+2)*3, 6, 8);
                } else {
                    ctx.fillRect(player.x - 10, player.y + 14, 6, 8);
                    ctx.fillRect(player.x + 4, player.y + 14, 6, 8);
                }
                ctx.shadowBlur = 0;

                // canavar (kırmızımsı, insansı)
                ctx.shadowBlur = 40;
                ctx.shadowColor = '#a03333';
                ctx.fillStyle = '#c04a4a';
                ctx.beginPath();
                ctx.arc(monster.x, monster.y, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#a03333';
                ctx.beginPath();
                ctx.arc(monster.x - 5, monster.y - 8, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.arc(monster.x + 5, monster.y - 8, 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#220000';
                ctx.beginPath();
                ctx.arc(monster.x - 6, monster.y - 10, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.arc(monster.x + 4, monster.y - 10, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#6a1a1a';
                ctx.fillRect(monster.x - 14, monster.y + 12, 10, 12);
                ctx.fillRect(monster.x + 4, monster.y + 12, 10, 12);
                ctx.shadowBlur = 0;

                // hareket yönü göstergesi (AI)
                if (gameActive) {
                    const angle = Math.atan2(player.y - monster.y, player.x - monster.x);
                    ctx.strokeStyle = '#ff666655';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(monster.x, monster.y);
                    ctx.lineTo(monster.x + Math.cos(angle) * 44, monster.y + Math.sin(angle) * 44);
                    ctx.stroke();
                }
            }

            // --- OYUN DÖNGÜSÜ ---
            let lastTime = 0;
            function gameLoop(time) {
                const dt = Math.min(0.05, (time - lastTime) / 1000);
                lastTime = time;
                if (gameActive) {
                    updatePlayer(dt);
                    updateMonster();
                }
                draw();
                requestAnimationFrame(gameLoop);
            }

            // --- KONTROLLER ---
            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                    keys[key] = true;
                    e.preventDefault();
                }
                if (key === 'shift') { keys.shift = true; e.preventDefault(); }
            });
            document.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                    keys[key] = false;
                    e.preventDefault();
                }
                if (key === 'shift') { keys.shift = false; e.preventDefault(); }
            });

            // mobil butonlar
            const btnLeft = document.getElementById('btnLeft');
            const btnRight = document.getElementById('btnRight');
            let mobileLeft = false, mobileRight = false;

            function setupMobileButton(btn, onStart, onEnd) {
                btn.addEventListener('mousedown', onStart);
                btn.addEventListener('mouseup', onEnd);
                btn.addEventListener('mouseleave', onEnd);
                btn.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); });
                btn.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); });
                btn.addEventListener('touchcancel', (e) => { e.preventDefault(); onEnd(); });
            }
            setupMobileButton(btnLeft, () => { keys.a = true; keys.d = false; }, () => { keys.a = false; });
            setupMobileButton(btnRight, () => { keys.d = true; keys.a = false; }, () => { keys.d = false; });

            // LOBBY / RESPAWN
            document.getElementById('startBtn').addEventListener('click', initGame);
            document.getElementById('respawnBtn').addEventListener('click', () => {
                deathOverlay.classList.remove('show');
                initGame();
            });

            // başlangıçta lobi görünsün
            lobbyEl.classList.remove('hidden');
            gameActive = false;

            // döngüyü başlat
            requestAnimationFrame(gameLoop);
        })();
    </script>
</body>
</html>
