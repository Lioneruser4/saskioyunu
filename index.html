<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON PAD — DJ Remix</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#05050a;
    background-image:
      radial-gradient(circle at 20% 0%,rgba(120,60,255,.18),transparent 50%),
      radial-gradient(circle at 80% 100%,rgba(255,60,140,.15),transparent 50%);
    color:#fff;font-family:'Segoe UI',system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:12px;gap:14px;overflow:hidden;
  }

  /* başlık */
  .head{display:flex;align-items:center;gap:10px;width:100%;max-width:600px}
  .logo{width:10px;height:10px;border-radius:50%;
    background:#7a5cff;box-shadow:0 0 12px #7a5cff,0 0 24px #7a5cff}
  .title{font-size:.95rem;font-weight:700;letter-spacing:6px;
    background:linear-gradient(90deg,#7a5cff,#ff3b9d,#ffb03b);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .spacer{flex:1}
  .status{font-size:.65rem;color:#5a5a7a;letter-spacing:1px}

  /* video */
  #vidWrap{width:100%;max-width:600px;aspect-ratio:16/9;background:#000;
    border-radius:16px;overflow:hidden;display:none;
    box-shadow:0 0 0 1px #1e1e30,0 12px 40px rgba(122,92,255,.25)}
  #vidWrap video{width:100%;height:100%;object-fit:cover}

  /* GRID 6x6 */
  #grid{
    display:grid;grid-template-columns:repeat(6,1fr);gap:7px;
    width:100%;max-width:600px;padding:14px;
    background:linear-gradient(180deg,#0e0e18,#0a0a12);
    border-radius:22px;
    box-shadow:inset 0 0 0 1px #1e1e30,0 20px 60px rgba(0,0,0,.8);
  }
  .pad{
    aspect-ratio:1;border-radius:14px;position:relative;cursor:pointer;
    background:#14141f;
    box-shadow:inset 0 0 0 1px #23233a,inset 0 0 20px rgba(0,0,0,.6);
    transition:transform .08s,box-shadow .18s,background .18s;
    overflow:hidden;
  }
  .pad::after{
    content:"";position:absolute;inset:0;border-radius:14px;
    background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.5),transparent 70%);
    opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .pad.on{
    background:currentColor;
    box-shadow:0 0 28px currentColor,0 0 10px currentColor inset,
      inset 0 0 0 1px rgba(255,255,255,.3);
    transform:scale(1.04);
  }
  .pad.on::after{opacity:.9}
  .pad:active{transform:scale(.92)}

  /* KONTROL */
  .bar{display:flex;gap:8px;width:100%;max-width:600px}
  .btn{
    flex:1;background:linear-gradient(180deg,#1a1a2a,#12121e);
    color:#cfcfe8;border:none;padding:16px 8px;border-radius:14px;
    font-size:.85rem;font-weight:600;cursor:pointer;
    box-shadow:inset 0 0 0 1px #23233a,0 4px 12px rgba(0,0,0,.4);
    transition:background .2s,box-shadow .2s,color .2s;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:active{background:#23233a;box-shadow:inset 0 0 0 1px #3a3a5e}
  .btn.music{color:#7ad4ff}
  .btn.music:active{box-shadow:inset 0 0 0 1px #7ad4ff,0 0 20px rgba(122,212,255,.4)}
  .btn.video{color:#ff9ad4}
  .btn.video:active{box-shadow:inset 0 0 0 1px #ff9ad4,0 0 20px rgba(255,154,212,.4)}
  .btn.stop{
    flex:0 0 70px;color:#ff6b8a;font-size:1.3rem;
    background:linear-gradient(180deg,#2a0f1c,#1a0812)
  }
  .btn.stop:active{box-shadow:inset 0 0 0 1px #ff6b8a,0 0 24px rgba(255,107,138,.5)}
  input[type=file]{display:none}

  /* ses */
  .vol{display:flex;align-items:center;gap:12px;width:100%;max-width:600px;
    padding:0 6px;font-size:.8rem;color:#6a6a8a}
  input[type=range]{flex:1;height:28px;accent-color:#7a5cff;cursor:pointer}
</style>
</head>
<body>

  <div class="head">
    <div class="logo"></div>
    <div class="title">NEON PAD</div>
    <div class="spacer"></div>
    <div class="status" id="status">Hazır</div>
  </div>

  <div id="vidWrap"><video id="vid" muted playsinline></video></div>

  <div id="grid"></div>

  <div class="bar">
    <label class="btn music" for="audioFile">♪ Müzik</label>
    <input type="file" id="audioFile" accept="audio/*">
    <label class="btn video" for="videoFile">▶ Video</label>
    <input type="file" id="videoFile" accept="video/*">
    <button class="btn stop" id="stopAll">■</button>
  </div>

  <div class="vol">
    <span>🔊</span><input type="range" id="vol" min="0" max="100" value="80">
  </div>

<script>
const GRID=36;
const gridEl=document.getElementById('grid');
const statusEl=document.getElementById('status');
const vidWrap=document.getElementById('vidWrap');
const vid=document.getElementById('vid');
const volEl=document.getElementById('vol');

let audioCtx,masterGain,buffer=null;
let pads=[];
let videoURL=null;

const DB='neonPad',STORE='f';
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=e=>e.target.result.createObjectStore(STORE);
  r.onsuccess=e=>res(e.target.result);r.onerror=e=>rej(e)});
const dbPut=async(k,b)=>{const db=await openDB();return new Promise((res,rej)=>{
  const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(b,k);
  tx.oncomplete=res;tx.onerror=e=>rej(e)})};
const dbGet=async k=>{const db=await openDB();return new Promise((res,rej)=>{
  const tx=db.transaction(STORE,'readonly');const rq=tx.objectStore(STORE).get(k);
  rq.onsuccess=()=>res(rq.result);rq.onerror=e=>rej(e)})};

function initAudio(){
  if(audioCtx)return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=volEl.value/100;
  masterGain.connect(audioCtx.destination);
}

// neon renk paleti
const palette=[
  '#ff2d6f','#ff5c2d','#ffb02d','#d0ff2d','#5cff8f','#2dffd0',
  '#2db0ff','#5c5cff','#a02dff','#ff2dd0','#ff2d2d','#ff8f2d'
];
const colorFor=i=>palette[i%palette.length];

// grid
for(let i=0;i<GRID;i++){
  const el=document.createElement('div');
  el.className='pad';
  el.dataset.i=i;
  el.style.color=colorFor(i);
  gridEl.appendChild(el);
  pads.push({el,src:null,active:false,timer:null});
}

gridEl.addEventListener('pointerdown',e=>{
  const p=e.target.closest('.pad');if(!p)return;
  triggerPad(+p.dataset.i);
});

function triggerPad(i){
  if(!buffer){statusEl.textContent='Önce müzik yükle';return;}
  initAudio();
  if(audioCtx.state==='suspended')audioCtx.resume();

  const pad=pads[i];
  // aynı pad zaten çalıyorsa: yeniden başlat
  if(pad.src){try{pad.src.stop()}catch(e){}}
  if(pad.timer){clearTimeout(pad.timer);pad.timer=null;}

  const dur=buffer.duration;
  const slice=dur/GRID;
  const off=(i*slice)%dur;
  const src=audioCtx.createBufferSource();
  src.buffer=buffer;
  src.loop=false;
  src.connect(masterGain);
  src.start(0,off,slice);          // tek sefer, slice süresi kadar
  pad.src=src;
  pad.active=true;
  pad.el.classList.add('on');

  // dilim bitince sön
  const ms=slice*1000;
  pad.timer=setTimeout(()=>{
    pad.active=false;
    pad.el.classList.remove('on');
    pad.src=null;pad.timer=null;
    syncVideo();
  },ms);

  syncVideo();
}

function syncVideo(){
  if(!vid.src||!vid.duration||!buffer)return;
  const act=pads.find(p=>p.active);
  if(!act){vid.pause();return;}
  const i=+act.el.dataset.i;
  const slice=vid.duration/GRID;
  vid.currentTime=(i*slice)%vid.duration;
  vid.play().catch(()=>{});
}

volEl.addEventListener('input',()=>{if(masterGain)masterGain.gain.value=volEl.value/100;});

document.getElementById('audioFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  initAudio();
  statusEl.textContent='Müzik çözülüyor...';
  try{
    buffer=await audioCtx.decodeAudioData(await f.arrayBuffer());
    await dbPut('a',f);
    statusEl.textContent=`✓ ${f.name}`;
  }catch(err){statusEl.textContent='Hata: müzik okunamadı'}
  e.target.value='';
});

document.getElementById('videoFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  if(videoURL)URL.revokeObjectURL(videoURL);
  videoURL=URL.createObjectURL(f);
  vid.src=videoURL;vid.muted=true;
  vidWrap.style.display='block';
  await dbPut('v',f);
  statusEl.textContent='Video hazır';
  e.target.value='';
  vid.onloadedmetadata=()=>syncVideo();
});

document.getElementById('stopAll').addEventListener('click',()=>{
  pads.forEach(p=>{
    if(p.src){try{p.src.stop()}catch(e){}}
    if(p.timer)clearTimeout(p.timer);
    p.src=null;p.timer=null;p.active=false;
    p.el.classList.remove('on');
  });
  vid.pause();
  statusEl.textContent='Durduruldu';
});

(async()=>{
  try{
    const a=await dbGet('a');
    if(a){initAudio();buffer=await audioCtx.decodeAudioData(await a.arrayBuffer());
      statusEl.textContent='Müzik hazır';}
    const v=await dbGet('v');
    if(v){videoURL=URL.createObjectURL(v);vid.src=videoURL;vid.muted=true;
      vidWrap.style.display='block';vid.onloadedmetadata=()=>syncVideo();}
  }catch(e){}
})();
</script>
</body>
</html>
