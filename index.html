<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kelime Oyunu</title>
    <style>
        :root {
            --bg-color: #121213;
            --text-color: #ffffff;
            --tile-border: #3a3a3c;
            --green: #538d4e;
            --yellow: #b59f3b;
            --gray: #3a3a3c;
            --key-bg: #818384;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation; /* Mobilde çift tıklama zoom'unu engeller */
        }

        /* Ekran Geçişleri */
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out forwards;
        }
        .screen.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Dil Seçim Ekranı */
        .lang-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        .lang-btn {
            background: #2a2a2d;
            border: 2px solid var(--tile-border);
            color: white;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .lang-btn:active { transform: scale(0.92); background: #3a3a3c; }
        .lang-btn span { font-size: 28px; }

        /* Oyun Üst Bar */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid var(--tile-border);
            height: 60px;
        }

        .header-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        .settings-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }

        /* Oyun Tahtası */
        .game-board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            padding: 10px;
            flex-grow: 1;
            max-height: 55vh;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
            margin-top: 10px;
        }

        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        .tile {
            width: 100%;
            height: 100%;
            border: 2px solid var(--tile-border);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: transform 0.1s, background-color 0.3s, border-color 0.3s;
        }

        /* Animasyonlar */
        .tile.pop { animation: pop 0.1s ease-in-out; }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .tile.flip { animation: flip 0.5s ease forwards; }
        @keyframes flip {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0); }
        }

        .tile.correct { background-color: var(--green); border-color: var(--green); }
        .tile.present { background-color: var(--yellow); border-color: var(--yellow); }
        .tile.absent { background-color: var(--gray); border-color: var(--gray); }

        /* Klavye */
        .keyboard-container {
            padding: 10px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: max(10px, env(safe-area-inset-bottom)); /* iPhone çentik uyumu */
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
            gap: 5px;
        }

        .key {
            background-color: var(--key-bg);
            color: white;
            border: none;
            border-radius: 4px;
            height: 50px;
            flex-grow: 1;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }

        .key:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.2);
        }

        .key.wide { flex-grow: 1.5; font-size: 0.9rem; }
        .key.correct { background-color: var(--green); }
        .key.present { background-color: var(--yellow); }
        .key.absent { background-color: var(--gray); }

        /* Modallar */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.2s ease-out;
        }
        .modal.active { display: flex; }
        
        .modal-content {
            background: #1a1a1c;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 90%;
            width: 320px;
            border: 1px solid var(--tile-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-title { font-size: 24px; margin-bottom: 15px; font-weight: bold; }
        .modal-text { font-size: 16px; color: #aaa; margin-bottom: 20px; }
        
        .modal-btn {
            background: var(--green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: opacity 0.2s;
        }
        .modal-btn:active { opacity: 0.8; }
        .modal-btn.secondary { background: #3a3a3c; }

        /* Bildirim (Toast) */
        #toast-container {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 300px;
        }

        .toast {
            background: white;
            color: black;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            animation: slideDown 0.3s ease-out, fadeOut 0.3s ease-in 1.5s forwards;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            to { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Dil Seçim Ekranı -->
    <div id="lang-screen" class="screen">
        <h1 style="margin-bottom: 30px; font-size: 28px; text-align: center;">Dil Seçin<br><span style="font-size: 16px; color: #aaa;">Select Language</span></h1>
        <div class="lang-container">
            <button class="lang-btn" onclick="startGame('tr')"><span>🇹🇷</span> Türkçe</button>
            <button class="lang-btn" onclick="startGame('az')"><span>🇦🇿</span> Azərbaycan</button>
            <button class="lang-btn" onclick="startGame('ru')"><span>🇷🇺</span> Русский</button>
            <button class="lang-btn" onclick="startGame('en')"><span>🇬🇧</span> English</button>
        </div>
    </div>

    <!-- Oyun Ekranı -->
    <div id="game-screen" class="screen">
        <header>
            <button class="settings-btn" onclick="openSettings()">⚙️</button>
            <div class="header-title" id="game-title">KELİME</div>
            <div style="width: 34px;"></div>
        </header>
        
        <div class="game-board" id="board"></div>
        <div class="keyboard-container" id="keyboard"></div>
    </div>

    <!-- Ayarlar Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-title">Ayarlar</div>
            <p class="modal-text">Mevcut Dil: <strong id="current-lang-text" style="color: white;"></strong></p>
            <button class="modal-btn secondary" onclick="changeLanguage()">Dili Değiştir</button>
            <button class="modal-btn" onclick="closeSettings()">Kapat</button>
        </div>
    </div>

    <!-- Sonuç Modal -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <div class="modal-title" id="result-title">Tebrikler!</div>
            <p class="modal-text" id="result-text"></p>
            <button class="modal-btn" onclick="resetGame()">Yeni Oyun</button>
        </div>
    </div>

    <!-- Bildirim Alanı -->
    <div id="toast-container"></div>

    <!-- Kelimeler Dosyası -->
    <script src="kelimeler.js"></script>
    
    <script>
        // --- Değişkenler ---
        let currentLang = 'tr';
        let secretWord = '';
        let currentRow = 0;
        let currentTile = 0;
        let gameOver = false;
        const maxRows = 6;
        const wordLength = 5;

        // Tarayıcı uyumlu basit ses sentezleyici (Harici dosya gerektirmez)
        let audioCtx;
        function playTone(freq, type, duration, vol = 0.1) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const soundCorrect = () => playTone(600, 'sine', 0.1);
        const soundPresent = () => playTone(400, 'triangle', 0.1);
        const soundAbsent = () => playTone(200, 'sawtooth', 0.1, 0.05);
        const soundWin = () => { playTone(500, 'square', 0.1); setTimeout(()=>playTone(700, 'square', 0.1), 100); setTimeout(()=>playTone(900, 'square', 0.2), 200); };
        const soundError = () => playTone(150, 'sawtooth', 0.2, 0.1);

        // --- Başlangıç ---
        window.onload = () => {
            const savedLang = localStorage.getItem('kelime_lang');
            if (savedLang && KELIMELER[savedLang]) {
                startGame(savedLang);
            } else {
                document.getElementById('lang-screen').classList.add('active');
            }
            
            // Telegram WebView Tam Ekran ve Kapatma Onayı
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.expand();
                window.Telegram.WebApp.enableClosingConfirmation();
            }
        };

        function startGame(lang) {
            currentLang = lang;
            localStorage.setItem('kelime_lang', lang);
            
            document.getElementById('lang-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            
            // Başlık güncelle
            const titles = { tr: 'KELİME', az: 'SÖZ', ru: 'СЛОВО', en: 'WORD' };
            document.getElementById('game-title').innerText = titles[lang] || 'KELİME';

            resetGame();
            buildKeyboard();
        }

        function changeLanguage() {
            localStorage.removeItem('kelime_lang');
            document.getElementById('settings-modal').classList.remove('active');
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('lang-screen').classList.add('active');
            document.getElementById('result-modal').classList.remove('active');
        }

        function resetGame() {
            gameOver = false;
            currentRow = 0;
            currentTile = 0;
            
            const langWords = KELIMELER[currentLang].filter(w => w.length === wordLength);
            secretWord = langWords[Math.floor(Math.random() * langWords.length)];
            
            // Tahtayı temizle
            const board = document.getElementById('board');
            board.innerHTML = '';
            for (let i = 0; i < maxRows; i++) {
                const row = document.createElement('div');
                row.className = 'row';
                for (let j = 0; j < wordLength; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.id = `tile-${i}-${j}`;
                    row.appendChild(tile);
                }
                board.appendChild(row);
            }

            // Klavyeyi sıfırla
            document.querySelectorAll('.key').forEach(k => {
                k.classList.remove('correct', 'present', 'absent');
            });

            document.getElementById('result-modal').classList.remove('active');
        }

        // --- Klavye Oluşturma ---
        function buildKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';
            
            let rows = [];
            if (currentLang === 'ru') {
                rows = [
                    ['Й','Ц','У','К','Е','Н','Г','Ш','Щ','З','Х','Ъ'],
                    ['Ф','Ы','В','А','П','Р','О','Л','Д','Ж','Э'],
                    ['ENTER','Я','Ч','С','М','И','Т','Ь','Б','Ю','BACKSPACE']
                ];
            } else if (currentLang === 'az') {
                rows = [
                    ['Q','Ü','E','R','T','Y','U','I','O','P','Ö','Ğ'],
                    ['A','S','D','F','G','H','J','K','L','İ','Ə'],
                    ['ENTER','Z','X','C','V','B','N','M','Ç','Ş','BACKSPACE']
                ];
            } else if (currentLang === 'tr') {
                rows = [
                    ['Q','W','E','R','T','Y','U','I','O','P','Ğ','Ü'],
                    ['A','S','D','F','G','H','J','K','L','Ş','İ'],
                    ['ENTER','Z','X','C','V','B','N','M','Ö','Ç','BACKSPACE']
                ];
            } else { // EN
                rows = [
                    ['Q','W','E','R','T','Y','U','I','O','P'],
                    ['A','S','D','F','G','H','J','K','L'],
                    ['ENTER','Z','X','C','V','B','N','M','BACKSPACE']
                ];
            }

            rows.forEach(rowKeys => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';
                rowKeys.forEach(k => {
                    const btn = document.createElement('button');
                    btn.className = 'key';
                    btn.innerText = k;
                    if (k === 'ENTER' || k === 'BACKSPACE') {
                        btn.classList.add('wide');
                    }
                    btn.onclick = () => handleKey(k);
                    rowDiv.appendChild(btn);
                });
                keyboard.appendChild(rowDiv);
            });
        }

        // --- Tuş Tıklama ---
        function handleKey(key) {
            if (gameOver) return;
            
            if (key === 'ENTER') {
                checkWord();
            } else if (key === 'BACKSPACE') {
                deleteLetter();
            } else if (currentTile < wordLength) {
                addLetter(key);
            }
        }

        function addLetter(letter) {
            if (currentTile < wordLength) {
                const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
                tile.textContent = letter;
                tile.classList.add('pop');
                setTimeout(() => tile.classList.remove('pop'), 100);
                currentTile++;
            }
        }

        function deleteLetter() {
            if (currentTile > 0) {
                currentTile--;
                const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
                tile.textContent = '';
            }
        }

        // --- Kelime Kontrolü ---
        function checkWord() {
            if (currentTile !== wordLength) {
                showToast("Yetersiz harf!");
                soundError();
                return;
            }

            const guess = [];
            for (let i = 0; i < wordLength; i++) {
                guess.push(document.getElementById(`tile-${currentRow}-${i}`).textContent.toLocaleUpperCase(currentLang));
            }
            
            const target = secretWord.toLocaleUpperCase(currentLang);
            
            // Harf sayılarını tut (aynı harften birden fazla varsa doğru renklendirme için)
            const targetLetterCount = {};
            for (let l of target) targetLetterCount[l] = (targetLetterCount[l] || 0) + 1;

            const rowTiles = [];
            for (let i = 0; i < wordLength; i++) {
                rowTiles.push(document.getElementById(`tile-${currentRow}-${i}`));
            }

            // 1. Aşama: Yeşil (Doğru yer)
            for (let i = 0; i < wordLength; i++) {
                if (guess[i] === target[i]) {
                    rowTiles[i].classList.add('flip');
                    setTimeout(() => {
                        rowTiles[i].classList.add('correct');
                        updateKeyboardKey(guess[i], 'correct');
                        soundCorrect();
                    }, i * 150);
                    targetLetterCount[guess[i]]--;
                    guess[i] = null; // İşaretlendi
                }
            }

            // 2. Aşama: Sarı (Yanlış yer) ve Gri
            for (let i = 0; i < wordLength; i++) {
                if (guess[i] !== null) {
                    rowTiles[i].classList.add('flip');
                    setTimeout(() => {
                        if (targetLetterCount[guess[i]] > 0) {
                            rowTiles[i].classList.add('present');
                            updateKeyboardKey(guess[i], 'present');
                            soundPresent();
                            targetLetterCount[guess[i]]--;
                        } else {
                            rowTiles[i].classList.add('absent');
                            updateKeyboardKey(guess[i], 'absent');
                            soundAbsent();
                        }
                    }, i * 150);
                }
            }

            // Oyun kontrolü
            setTimeout(() => {
                const guessStr = rowTiles.map(t => t.textContent).join('');
                if (guessStr === target) {
                    gameOver = true;
                    soundWin();
                    showResult(true);
                } else {
                    currentRow++;
                    currentTile = 0;
                    if (currentRow === maxRows) {
                        gameOver = true;
                        showResult(false);
                    }
                }
            }, wordLength * 150 + 100);
        }

        function updateKeyboardKey(letter, status) {
            const keys = document.querySelectorAll('.key');
            for (let key of keys) {
                if (key.innerText === letter) {
                    // Eğer harf zaten yeşilse gri yapma
                    if (key.classList.contains('correct')) return;
                    // Eğer harf sarıysa ve gri yapılmaya çalışılıyorsa engelle
                    if (key.classList.contains('present') && status === 'absent') return;
                    
                    key.classList.remove('present', 'absent'); // Önceki durumları temizle
                    key.classList.add(status);
                }
            }
        }

        function showResult(isWin) {
            const modal = document.getElementById('result-modal');
            const title = document.getElementById('result-title');
            const text = document.getElementById('result-text');
            
            if (isWin) {
                title.innerText = "Tebrikler! 🎉";
                title.style.color = "var(--green)";
                text.innerHTML = `Doğru kelimeyi <strong>${currentRow + 1}. denemede</strong> buldun:<br><br><span style="font-size: 24px; color: white; letter-spacing: 2px;">${secretWord}</span>`;
            } else {
                title.innerText = "Oyun Bitti 😔";
                title.style.color = "#ff4d4d";
                text.innerHTML = `Maalesef bilemedin.<br>Doğru kelime:<br><br><span style="font-size: 24px; color: white; letter-spacing: 2px;">${secretWord}</span>`;
            }
            modal.classList.add('active');
        }

        // --- Modal İşlemleri ---
        function openSettings() {
            const langNames = { tr: 'Türkçe', az: 'Azərbaycan', ru: 'Русский', en: 'English' };
            document.getElementById('current-lang-text').innerText = langNames[currentLang];
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        // --- Bildirim (Toast) ---
        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = message;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 2000);
        }

        // Fiziksel Klavye Desteği (PC için)
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('game-screen').classList.contains('active') || gameOver) return;
            
            if (e.key === 'Enter') handleKey('ENTER');
            else if (e.key === 'Backspace') handleKey('BACKSPACE');
            else if (e.key.length === 1 && /^[a-zA-ZğüşıöçĞÜŞİÖÇа-яА-ЯёЁəƏ]+$/.test(e.key)) {
                handleKey(e.key.toLocaleUpperCase(currentLang));
            }
        });
    </script>
</body>
</html>
