<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Zar Masası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --felt-dark:#062219;
  --felt:#0c3a2b;
  --felt-light:#155a44;
  --wood-dark:#2a160c;
  --wood:#4a2815;
  --wood-light:#6b3d20;
  --gold:#d4af37;
  --gold-bright:#f3dd8a;
  --gold-dim:#8a7128;
  --cream:#f3ead2;
  --cream-dim:#cabe9d;
  --danger:#c0473b;
  --ok:#3f9e6a;
  --shadow:rgba(0,0,0,.55);
  font-size:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{
  height:100%; margin:0; overflow:hidden; touch-action:manipulation;
  background:var(--felt-dark);
  font-family:'Poppins',sans-serif;
  color:var(--cream);
}
.mono{font-family:'Space Mono',monospace;}
.display{font-family:'Cinzel',serif;}

#app{
  position:fixed; inset:0;
  display:flex; flex-direction:column;
  height:100dvh; width:100vw;
  background:
    radial-gradient(120% 90% at 50% -10%, #123f2f 0%, transparent 60%),
    var(--felt-dark);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ---------- TOP BAR ---------- */
#topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 16px; z-index:20;
  flex-shrink:0;
}
.brand{
  display:flex; align-items:center; gap:8px;
  font-family:'Cinzel',serif; font-weight:700; letter-spacing:.08em;
  font-size:.95rem; color:var(--gold-bright);
  text-shadow:0 1px 0 rgba(0,0,0,.4);
}
.brand .dot{color:var(--gold); font-size:1.1rem;}
.balance-pill{
  display:flex; align-items:center; gap:8px;
  background:linear-gradient(180deg,#123a2c,#0a2419);
  border:1px solid var(--gold-dim);
  border-radius:999px; padding:7px 14px 7px 8px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 3px 8px rgba(0,0,0,.4);
}
.coin-icon{
  width:22px; height:22px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 55%, var(--gold-dim) 100%);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:800; color:#3d2f05;
  box-shadow:0 1px 2px rgba(0,0,0,.5);
  flex-shrink:0;
}
#balanceVal{font-family:'Space Mono',monospace; font-weight:700; font-size:.95rem; letter-spacing:.02em;}
.reset-btn{
  font-size:.6rem; color:var(--cream-dim); background:none; border:1px solid rgba(255,255,255,.15);
  border-radius:999px; padding:3px 8px; margin-left:2px; font-family:'Poppins',sans-serif;
}

/* ---------- SCREENS ---------- */
.screen{
  position:absolute; inset:0; display:flex; flex-direction:column;
  transition:opacity .35s ease, transform .35s ease;
}
.screen.hidden{opacity:0; pointer-events:none; transform:scale(.98);}

/* ===== SETUP SCREEN ===== */
#setupScreen{ align-items:center; justify-content:flex-start; padding:70px 20px 20px; overflow-y:auto;}
.setup-card{
  width:100%; max-width:420px; margin:0 auto;
  text-align:center;
}
.setup-title{
  font-size:2.1rem; color:var(--gold-bright); letter-spacing:.05em;
  text-shadow:0 2px 10px rgba(0,0,0,.5);
  margin:6px 0 2px;
}
.setup-sub{color:var(--cream-dim); font-size:.85rem; margin-bottom:26px; letter-spacing:.02em;}

.section-label{
  display:flex; align-items:center; gap:10px;
  color:var(--gold); font-size:.72rem; letter-spacing:.15em; text-transform:uppercase;
  margin:22px 0 12px; font-weight:600;
}
.section-label::after{content:''; flex:1; height:1px; background:linear-gradient(90deg,var(--gold-dim),transparent);}

.stepper{
  display:flex; align-items:center; justify-content:center; gap:18px;
  background:rgba(0,0,0,.2); border:1px solid rgba(212,175,55,.25);
  border-radius:18px; padding:14px;
}
.stepper button{
  width:44px; height:44px; border-radius:50%; border:1px solid var(--gold-dim);
  background:linear-gradient(180deg,#1b5440,#0c3527);
  color:var(--gold-bright); font-size:1.3rem; font-weight:700;
}
.stepper button:active{transform:scale(.9);}
#playerCountVal{
  font-family:'Cinzel',serif; font-size:1.7rem; font-weight:700; min-width:90px;
  color:var(--cream);
}
#playerCountVal span{display:block; font-family:'Poppins',sans-serif; font-size:.6rem; color:var(--cream-dim); font-weight:400; letter-spacing:.1em; margin-top:2px;}

.chip-grid{
  display:grid; grid-template-columns:repeat(4,1fr); gap:9px;
}
.chip{
  position:relative; padding:12px 4px; border-radius:14px;
  border:1px solid var(--gold-dim);
  background:radial-gradient(120% 140% at 30% 0%, #1c5a44, #0b2c21);
  color:var(--cream); font-family:'Space Mono',monospace; font-weight:700; font-size:.82rem;
  box-shadow:0 3px 0 rgba(0,0,0,.35);
}
.chip:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.35);}
.chip.active{
  background:radial-gradient(120% 140% at 30% 0%, var(--gold-bright), var(--gold) 60%, var(--gold-dim));
  color:#2c2308; border-color:var(--gold-bright);
  box-shadow:0 0 0 2px rgba(243,221,138,.35), 0 3px 10px rgba(212,175,55,.4);
}
.custom-bet-row{
  display:flex; align-items:center; gap:10px; margin-top:12px;
  background:rgba(0,0,0,.2); border:1px solid rgba(212,175,55,.2); border-radius:14px; padding:10px 14px;
}
.custom-bet-row input[type=range]{flex:1; accent-color:var(--gold);}
#customBetVal{font-family:'Space Mono',monospace; font-weight:700; min-width:74px; text-align:right; font-size:.82rem; color:var(--gold-bright);}

.cta-btn{
  width:100%; margin-top:28px; padding:16px; border-radius:16px; border:none;
  font-family:'Cinzel',serif; font-weight:700; font-size:1.05rem; letter-spacing:.06em;
  background:linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, #a3831f);
  color:#2c2205;
  box-shadow:0 6px 0 #7a611c, 0 10px 20px rgba(0,0,0,.4);
}
.cta-btn:active{transform:translateY(4px); box-shadow:0 2px 0 #7a611c, 0 4px 10px rgba(0,0,0,.4);}
.cta-btn:disabled{filter:grayscale(.6) brightness(.7); box-shadow:0 6px 0 #333;}
.setup-hint{margin-top:12px; font-size:.72rem; color:var(--cream-dim); min-height:16px;}
.setup-hint.warn{color:#ff9b8a;}

/* ===== GAME SCREEN ===== */
#gameScreen{align-items:center; justify-content:space-between;}
#tableWrap{
  position:relative; flex:1; width:100%; display:flex; align-items:center; justify-content:center;
  padding:6px 10px;
}
#table{
  position:relative; width:min(92vw, 480px); height:min(72vh, 560px);
  border-radius:50%;
  background:
    radial-gradient(60% 55% at 50% 45%, var(--felt-light) 0%, var(--felt) 55%, var(--felt-dark) 100%);
  border:14px solid var(--wood);
  box-shadow:
    inset 0 0 0 3px rgba(212,175,55,.35),
    inset 0 10px 40px rgba(0,0,0,.55),
    0 18px 40px rgba(0,0,0,.6),
    0 0 0 3px var(--wood-dark);
}
#table::before{
  content:''; position:absolute; inset:14px; border-radius:50%;
  border:1px solid rgba(212,175,55,.25);
  pointer-events:none;
}

.seat{
  position:absolute; width:66px; height:66px; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  transition:filter .25s;
}
.seat-avatar{
  width:50px; height:50px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:1.5rem;
  background:linear-gradient(160deg,#245a45,#0e3327);
  border:2px solid rgba(212,175,55,.5);
  box-shadow:0 3px 8px rgba(0,0,0,.5);
  position:relative;
  transition:box-shadow .25s, border-color .25s, transform .25s;
}
.seat.you .seat-avatar{border-color:var(--gold-bright);}
.seat.active .seat-avatar{
  border-color:var(--gold-bright);
  box-shadow:0 0 0 4px rgba(243,221,138,.28), 0 0 18px rgba(243,221,138,.55);
  transform:scale(1.1);
}
.seat.winner .seat-avatar{
  animation:winPulse 1s ease-in-out infinite;
}
@keyframes winPulse{
  0%,100%{box-shadow:0 0 0 4px rgba(63,158,106,.35), 0 0 22px rgba(63,158,106,.7);}
  50%{box-shadow:0 0 0 8px rgba(63,158,106,.15), 0 0 32px rgba(63,158,106,.9);}
}
.seat-name{font-size:.62rem; color:var(--cream); font-weight:600; text-shadow:0 1px 2px #000; white-space:nowrap;}
.seat-name b{color:var(--gold-bright);}
.thinking-dots{position:absolute; top:-8px; right:-4px; font-size:.6rem; opacity:0; transition:opacity .2s;}
.seat.rolling .thinking-dots{opacity:1;}

#potWrap{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; gap:10px; z-index:5;
}
#potLabel{font-size:.6rem; letter-spacing:.2em; color:var(--gold); text-transform:uppercase;}
#potAmount{
  font-family:'Space Mono',monospace; font-weight:700; font-size:1.15rem; color:var(--gold-bright);
  text-shadow:0 2px 6px rgba(0,0,0,.6);
}
#diceArea{display:flex; gap:16px; perspective:600px;}
.die{
  width:52px; height:52px; position:relative; transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.2,.85,.3,1);
}
.face{
  position:absolute; inset:0; border-radius:9px;
  background:linear-gradient(160deg,#fdf8ec,#ece0bd);
  border:1px solid #cbb974;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.6), 0 2px 6px rgba(0,0,0,.4);
  display:grid; grid-template-areas:"tl . tr" "ml c mr" "bl . br";
  padding:7px; gap:2px;
}
.pip{width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #6b2a1c, #3a1409); align-self:center; justify-self:center;}
.p-tl{grid-area:tl;} .p-tr{grid-area:tr;} .p-ml{grid-area:ml;} .p-mr{grid-area:mr;}
.p-bl{grid-area:bl;} .p-br{grid-area:br;} .p-c{grid-area:c;}
.f1{transform:rotateY(0deg) translateZ(26px);}
.f6{transform:rotateY(180deg) translateZ(26px);}
.f2{transform:rotateY(90deg) translateZ(26px);}
.f5{transform:rotateY(-90deg) translateZ(26px);}
.f3{transform:rotateX(90deg) translateZ(26px);}
.f4{transform:rotateX(-90deg) translateZ(26px);}

.flying-coin{
  position:absolute; width:16px; height:16px; border-radius:50%; z-index:30;
  background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 55%, var(--gold-dim));
  box-shadow:0 2px 4px rgba(0,0,0,.5);
  transition:transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
  pointer-events:none;
}

/* ---------- turn banner ---------- */
#turnBanner{
  text-align:center; font-size:.85rem; color:var(--cream); min-height:20px;
  letter-spacing:.02em; padding:0 20px;
}
#turnBanner b{color:var(--gold-bright);}

/* ---------- bottom controls ---------- */
#controls{
  width:100%; padding:14px 20px calc(18px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; align-items:center; gap:10px; flex-shrink:0;
}
#rollBtn{
  width:100%; max-width:420px; padding:17px; border-radius:18px; border:none;
  font-family:'Cinzel',serif; font-weight:700; font-size:1.15rem; letter-spacing:.08em;
  background:linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, #a3831f);
  color:#2c2205;
  box-shadow:0 6px 0 #7a611c, 0 10px 22px rgba(0,0,0,.45);
}
#rollBtn:active{transform:translateY(4px); box-shadow:0 2px 0 #7a611c;}
#rollBtn:disabled{filter:grayscale(.7) brightness(.65); box-shadow:0 6px 0 #333;}
.leave-btn{
  background:none; border:1px solid rgba(255,255,255,.2); color:var(--cream-dim);
  font-size:.72rem; padding:8px 16px; border-radius:999px; letter-spacing:.05em;
}

/* ---------- win overlay ---------- */
#winOverlay{
  position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background:rgba(4,15,10,.72); backdrop-filter:blur(3px);
  opacity:0; pointer-events:none; transition:opacity .4s ease;
}
#winOverlay.show{opacity:1; pointer-events:auto;}
.win-card{
  text-align:center; padding:34px 30px; border-radius:22px;
  background:linear-gradient(160deg,#164a37,#0a2a1f);
  border:1px solid var(--gold-dim);
  box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  max-width:340px;
  transform:scale(.85); transition:transform .4s cubic-bezier(.2,.9,.3,1.3);
}
#winOverlay.show .win-card{transform:scale(1);}
.win-crown{font-size:2.6rem; margin-bottom:6px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.5));}
.win-title{font-family:'Cinzel',serif; font-size:1.4rem; color:var(--gold-bright); letter-spacing:.04em;}
.win-name{font-family:'Poppins',sans-serif; font-weight:700; font-size:1.05rem; margin-top:6px; color:var(--cream);}
.win-amount{font-family:'Space Mono',monospace; font-size:1.6rem; color:var(--ok); margin-top:14px; font-weight:700;}
.win-amount.lose{color:var(--danger);}
.win-actions{display:flex; gap:10px; margin-top:22px;}
.win-actions button{flex:1; padding:12px; border-radius:12px; border:none; font-weight:700; font-size:.85rem; font-family:'Poppins',sans-serif;}
#playAgainBtn{background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#2c2205;}
#leaveTableBtn{background:rgba(255,255,255,.08); color:var(--cream); border:1px solid rgba(255,255,255,.15);}

.confetti{position:absolute; top:-10px; width:8px; height:14px; opacity:.95; z-index:2;}

::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div class="brand"><span class="dot">♠</span> ZAR MASASI</div>
    <div class="balance-pill">
      <div class="coin-icon">₺</div>
      <span id="balanceVal">1.000</span>
      <button class="reset-btn" id="resetBtn" style="display:none;">Yenile</button>
    </div>
  </div>

  <!-- SETUP SCREEN -->
  <div class="screen" id="setupScreen">
    <div class="setup-card">
      <div class="setup-title display">Masayı Kur</div>
      <div class="setup-sub">Botlara karşı otur, zarı sallayan çift getirirse potu toplar.</div>

      <div class="section-label">Oyuncu Sayısı</div>
      <div class="stepper">
        <button id="decBtn">−</button>
        <div id="playerCountVal">4<span>OYUNCU</span></div>
        <button id="incBtn">+</button>
      </div>

      <div class="section-label">Bahis Miktarı</div>
      <div class="chip-grid" id="chipGrid">
        <button class="chip" data-v="100">100</button>
        <button class="chip" data-v="500">500</button>
        <button class="chip active" data-v="1000">1K</button>
        <button class="chip" data-v="3000">3K</button>
        <button class="chip" data-v="5000">5K</button>
        <button class="chip" data-v="10000">10K</button>
        <button class="chip" data-v="50000">50K</button>
        <button class="chip" data-v="100000">100K</button>
      </div>
      <div class="custom-bet-row">
        <span style="font-size:.68rem;color:var(--cream-dim);">50</span>
        <input type="range" id="customBet" min="50" max="100000" step="50" value="1000">
        <span id="customBetVal">1.000 ₺</span>
      </div>

      <button class="cta-btn display" id="createBtn">Masayı Kur</button>
      <div class="setup-hint" id="setupHint">Pot: 4.000 ₺ · Kazanan çift zarla tüm potu alır</div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen hidden" id="gameScreen">
    <div id="turnBanner">Masa kuruluyor…</div>
    <div id="tableWrap">
      <div id="table">
        <div id="potWrap">
          <div id="potLabel">POT</div>
          <div id="potAmount">0 ₺</div>
          <div id="diceArea">
            <div class="die" id="die1"></div>
            <div class="die" id="die2"></div>
          </div>
        </div>
        <!-- seats injected by JS -->
      </div>
    </div>
    <div id="controls">
      <button id="rollBtn" class="display">ZAR AT</button>
      <button class="leave-btn" id="leaveBtn">Masadan Kalk</button>
    </div>
  </div>

  <!-- WIN OVERLAY -->
  <div id="winOverlay">
    <div class="win-card">
      <div class="win-crown">🏆</div>
      <div class="win-title display">ÇİFT GELDİ!</div>
      <div class="win-name" id="winName">—</div>
      <div class="win-amount" id="winAmount">+0 ₺</div>
      <div class="win-actions">
        <button id="playAgainBtn">Yeni Tur</button>
        <button id="leaveTableBtn">Masadan Kalk</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  /* ---------------- STATE ---------------- */
  let balance = 1000;
  let playerCount = 4;
  let betAmount = 1000;
  const MIN_BET = 50, MAX_BET = 100000;

  let players = [];      // {id, name, isUser, avatar, seatEl, angle}
  let turnOrder = [];     // indices into players, rotated each round
  let turnPtr = 0;
  let pot = 0;
  let roundActive = false;
  let rollingLock = false;

  const BOT_NAMES = ["Ayşe","Mehmet","Deniz","Elif","Can","Zeynep","Burak","Selin"];
  const BOT_AVATARS = ["🧕","🧔","👩‍🦱","🧑‍🦳","👨‍🦰","👩‍🦳","🧑‍🎤","👨‍🦱"];

  /* ---------------- HELPERS ---------------- */
  const $ = (id)=>document.getElementById(id);
  const fmt = (n)=> n.toLocaleString('tr-TR');

  function updateBalanceUI(){
    $('balanceVal').textContent = fmt(balance);
    $('resetBtn').style.display = balance < MIN_BET ? 'inline-block' : 'none';
  }

  /* ---------------- SETUP SCREEN LOGIC ---------------- */
  function refreshSetupHint(){
    const p = pot0();
    $('setupHint').textContent = `Pot: ${fmt(p)} ₺ · Kazanan çift zarla tüm potu alır`;
    const btn = $('createBtn');
    if(betAmount > balance){
      $('setupHint').textContent = `Bakiyeniz yetersiz (bahis ${fmt(betAmount)} ₺)`;
      $('setupHint').classList.add('warn');
      btn.disabled = true;
    } else {
      $('setupHint').classList.remove('warn');
      btn.disabled = false;
    }
  }
  function pot0(){ return betAmount * playerCount; }

  function setPlayerCount(n){
    playerCount = Math.max(2, Math.min(8, n));
    $('playerCountVal').innerHTML = playerCount + '<span>OYUNCU</span>';
    refreshSetupHint();
  }
  $('decBtn').onclick = ()=> setPlayerCount(playerCount-1);
  $('incBtn').onclick = ()=> setPlayerCount(playerCount+1);

  function setBet(v, fromChip){
    betAmount = Math.max(MIN_BET, Math.min(MAX_BET, Math.round(v/50)*50));
    $('customBet').value = betAmount;
    $('customBetVal').textContent = fmt(betAmount) + ' ₺';
    document.querySelectorAll('.chip').forEach(c=>{
      c.classList.toggle('active', fromChip !== undefined ? c===fromChip : parseInt(c.dataset.v)===betAmount);
    });
    refreshSetupHint();
  }
  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=> setBet(parseInt(chip.dataset.v), chip));
  });
  $('customBet').addEventListener('input', (e)=> setBet(parseInt(e.target.value)));

  $('resetBtn').onclick = ()=>{ balance = 1000; updateBalanceUI(); refreshSetupHint(); };

  $('createBtn').onclick = ()=>{
    if(betAmount > balance) return;
    startTable();
  };

  /* ---------------- BUILD TABLE ---------------- */
  function startTable(){
    players = [];
    const shuffledBots = [...BOT_NAMES.keys()].sort(()=>Math.random()-.5);
    for(let i=0;i<playerCount;i++){
      if(i===0){
        players.push({id:0, name:'Sen', isUser:true, avatar:'😎'});
      } else {
        const bi = shuffledBots[i-1];
        players.push({id:i, name:BOT_NAMES[bi], isUser:false, avatar:BOT_AVATARS[bi]});
      }
    }
    renderSeats();
    $('setupScreen').classList.add('hidden');
    $('gameScreen').classList.remove('hidden');
    beginRound(true);
  }

  function renderSeats(){
    const table = $('table');
    table.querySelectorAll('.seat').forEach(s=>s.remove());
    const n = players.length;
    players.forEach((p, i)=>{
      const angle = 90 + (360/n)*i; // degrees, seat0 at bottom
      const rad = angle * Math.PI/180;
      const Rx = 40, Ry = 37; // percent
      const x = 50 + Rx*Math.cos(rad);
      const y = 50 + Ry*Math.sin(rad);
      const seat = document.createElement('div');
      seat.className = 'seat' + (p.isUser?' you':'');
      seat.style.left = x+'%';
      seat.style.top = y+'%';
      seat.innerHTML = `
        <div class="seat-avatar">${p.avatar}<span class="thinking-dots">💭</span></div>
        <div class="seat-name">${p.isUser?'<b>Sen</b>':p.name}</div>
      `;
      table.appendChild(seat);
      p.seatEl = seat;
    });
  }

  /* ---------------- ROUND FLOW ---------------- */
  function beginRound(anteFromUser){
    if(anteFromUser){
      balance -= betAmount;
      updateBalanceUI();
    }
    pot = betAmount * playerCount;
    $('potAmount').textContent = fmt(pot) + ' ₺';
    roundActive = true;
    turnOrder = players.map((_,i)=>i).sort(()=>Math.random()-.5);
    turnPtr = 0;
    players.forEach(p=> p.seatEl.classList.remove('winner','active'));
    setDiceStatic();
    animateAnte();
    $('turnBanner').textContent = 'Herkes potu ortaya koydu…';
    setTimeout(nextTurn, 900);
  }

  function animateAnte(){
    const tableRect = $('table').getBoundingClientRect();
    const cx = tableRect.width/2, cy = tableRect.height/2;
    players.forEach((p,idx)=>{
      const r = p.seatEl.getBoundingClientRect();
      const sx = r.left - tableRect.left + r.width/2;
      const sy = r.top - tableRect.top + r.height/2;
      const coin = document.createElement('div');
      coin.className = 'flying-coin';
      coin.style.left = sx+'px'; coin.style.top = sy+'px';
      coin.style.opacity = '1';
      $('table').appendChild(coin);
      requestAnimationFrame(()=>{
        coin.style.transform = `translate(${cx-sx}px, ${cy-sy}px) scale(.6)`;
        coin.style.opacity = '0';
      });
      setTimeout(()=>coin.remove(), 650);
    });
  }

  function currentPlayer(){ return players[turnOrder[turnPtr]]; }

  function nextTurn(){
    if(!roundActive) return;
    players.forEach(p=> p.seatEl.classList.remove('active','rolling'));
    const p = currentPlayer();
    p.seatEl.classList.add('active');

    if(p.isUser){
      $('turnBanner').innerHTML = `Sıra sende — <b>ZAR AT</b>'a bas`;
      $('rollBtn').disabled = false;
    } else {
      $('turnBanner').innerHTML = `<b>${p.name}</b> zar atıyor…`;
      $('rollBtn').disabled = true;
      p.seatEl.classList.add('rolling');
      const delay = 900 + Math.random()*900;
      setTimeout(()=>{ if(roundActive) rollDice(); }, delay);
    }
  }

  $('rollBtn').onclick = ()=>{
    if(rollingLock) return;
    const p = currentPlayer();
    if(!p.isUser) return;
    rollDice();
  };

  function faceRotation(n){
    switch(n){
      case 1: return 'rotateX(0deg) rotateY(0deg)';
      case 6: return 'rotateX(0deg) rotateY(-180deg)';
      case 2: return 'rotateX(0deg) rotateY(-90deg)';
      case 5: return 'rotateX(0deg) rotateY(90deg)';
      case 3: return 'rotateX(-90deg) rotateY(0deg)';
      case 4: return 'rotateX(90deg) rotateY(0deg)';
    }
  }

  function setDiceStatic(){
    $('die1').style.transition='none';
    $('die2').style.transition='none';
    $('die1').style.transform='rotateX(-18deg) rotateY(24deg)';
    $('die2').style.transform='rotateX(-18deg) rotateY(24deg)';
    requestAnimationFrame(()=>{
      $('die1').style.transition='';
      $('die2').style.transition='';
    });
  }

  function rollDice(){
    rollingLock = true;
    $('rollBtn').disabled = true;
    const p = currentPlayer();

    const v1 = 1+Math.floor(Math.random()*6);
    const v2 = 1+Math.floor(Math.random()*6);
    const spins1 = 3+Math.floor(Math.random()*2);
    const spins2 = 3+Math.floor(Math.random()*2);

    const d1 = $('die1'), d2 = $('die2');
    d1.style.transform = `rotateY(${360*spins1}deg) rotateX(${360*spins1}deg) ${faceRotation(v1)}`;
    d2.style.transform = `rotateY(${-360*spins2}deg) rotateX(${360*spins2}deg) ${faceRotation(v2)}`;

    setTimeout(()=>{
      resolveRoll(p, v1, v2);
    }, 1150);
  }

  function resolveRoll(p, v1, v2){
    p.seatEl.classList.remove('rolling');
    rollingLock = false;
    if(v1 === v2){
      $('turnBanner').innerHTML = `<b>${p.isUser?'Sen':p.name}</b> çift ${v1}-${v2} attı!`;
      setTimeout(()=> handleWin(p), 500);
    } else {
      $('turnBanner').innerHTML = `${p.isUser?'Sen':p.name}: ${v1}-${v2} · eşleşme yok`;
      turnPtr = (turnPtr+1) % turnOrder.length;
      setTimeout(nextTurn, 750);
    }
  }

  function handleWin(winner){
    roundActive = false;
    players.forEach(p=>p.seatEl.classList.remove('active'));
    winner.seatEl.classList.add('winner');
    $('rollBtn').disabled = true;
    $('turnBanner').innerHTML = `<b>${winner.isUser?'Sen':winner.name}</b> potu kazandı!`;

    // fly coins from pot to winner seat
    const tableRect = $('table').getBoundingClientRect();
    const r = winner.seatEl.getBoundingClientRect();
    const tx = r.left - tableRect.left + r.width/2;
    const ty = r.top - tableRect.top + r.height/2;
    const cx = tableRect.width/2, cy = tableRect.height/2;
    for(let i=0;i<10;i++){
      setTimeout(()=>{
        const coin = document.createElement('div');
        coin.className='flying-coin';
        coin.style.left=(cx+(Math.random()*20-10))+'px';
        coin.style.top=(cy+(Math.random()*20-10))+'px';
        coin.style.opacity='1';
        $('table').appendChild(coin);
        requestAnimationFrame(()=>{
          coin.style.transform=`translate(${tx-cx}px, ${ty-cy}px) scale(.5)`;
          coin.style.opacity='0';
        });
        setTimeout(()=>coin.remove(), 600);
      }, i*45);
    }

    if(winner.isUser){
      balance += pot;
      updateBalanceUI();
    }

    setTimeout(()=> showWinOverlay(winner), 900);
  }

  function showWinOverlay(winner){
    $('winName').textContent = winner.isUser ? 'Sen kazandın!' : winner.name + ' kazandı';
    const amt = $('winAmount');
    if(winner.isUser){
      amt.textContent = '+' + fmt(pot) + ' ₺';
      amt.classList.remove('lose');
    } else {
      amt.textContent = '−' + fmt(betAmount) + ' ₺';
      amt.classList.add('lose');
    }
    $('winOverlay').classList.add('show');
    launchConfetti();
    $('playAgainBtn').disabled = betAmount > balance;
    $('playAgainBtn').style.opacity = betAmount > balance ? .5 : 1;
  }

  function launchConfetti(){
    const colors = ['#d4af37','#f3dd8a','#3f9e6a','#f3ead2','#c0473b'];
    for(let i=0;i<26;i++){
      const c = document.createElement('div');
      c.className='confetti';
      c.style.left = (Math.random()*100)+'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.borderRadius = Math.random()>.5 ? '50%' : '2px';
      c.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(c);
      const dur = 1600+Math.random()*1200;
      const drift = (Math.random()*160-80);
      c.animate([
        {transform:`translate(0,0) rotate(0deg)`, opacity:1},
        {transform:`translate(${drift}px, 100vh) rotate(${Math.random()*720}deg)`, opacity:.9}
      ],{duration:dur, easing:'cubic-bezier(.3,.6,.4,1)'});
      setTimeout(()=>c.remove(), dur+50);
    }
  }

  $('playAgainBtn').onclick = ()=>{
    if(betAmount > balance) return;
    $('winOverlay').classList.remove('show');
    setTimeout(()=> beginRound(true), 300);
  };
  $('leaveTableBtn').onclick = ()=> returnToSetup();
  $('leaveBtn').onclick = ()=> returnToSetup();

  function returnToSetup(){
    roundActive = false;
    $('winOverlay').classList.remove('show');
    $('gameScreen').classList.add('hidden');
    $('setupScreen').classList.remove('hidden');
    refreshSetupHint();
  }

  /* ---------------- INIT ---------------- */
  function buildDiceFaces(){
    const patterns = {
      1:['c'],
      2:['tl','br'],
      3:['tl','c','br'],
      4:['tl','tr','bl','br'],
      5:['tl','tr','c','bl','br'],
      6:['tl','tr','ml','mr','bl','br']
    };
    ['die1','die2'].forEach(id=>{
      const die = $(id);
      die.innerHTML='';
      for(let n=1;n<=6;n++){
        const face = document.createElement('div');
        face.className = `face f${n}`;
        patterns[n].forEach(pos=>{
          const pip = document.createElement('div');
          pip.className = 'pip p-'+pos;
          face.appendChild(pip);
        });
        die.appendChild(face);
      }
    });
    setDiceStatic();
  }

  buildDiceFaces();
  updateBalanceUI();
  setPlayerCount(4);
  setBet(1000);
})();
</script>
</body>
</html>
