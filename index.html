<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:GO Case Opening Simulator</title>
    <style>
        :root {
            --milspec: #4b69ff;
            --restricted: #8847ff;
            --classified: #d32ce6;
            --covert: #eb4b4b;
            --special: #caab05;
            --dark-bg: #0e0e14;
            --panel-bg: #151520;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 10px;
            overflow-x: hidden;
            user-select: none;
        }

        h1 {
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #eceff1;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        /* Rulet Bölgesi */
        .roulette-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 2px solid #252538;
            border-radius: 8px;
            padding: 10px 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            margin-bottom: 30px;
        }

        /* Ortadaki Kırmızı Çizgi */
        .pointer {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background-color: #ff3e3e;
            z-index: 10;
            transform: translateX(-50%);
            box-shadow: 0 0 15px #ff3e3e;
            pointer-events: none;
        }

        /* Sol ve Sağ Kenar Gölgelikleri (CS:GO tarzı sinematik geçiş) */
        .roulette-container::before, .roulette-container::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 15%;
            z-index: 5;
            pointer-events: none;
        }
        .roulette-container::before {
            left: 0;
            background: linear-gradient(to right, rgba(14, 14, 20, 0.95), transparent);
        }
        .roulette-container::after {
            right: 0;
            background: linear-gradient(to left, rgba(14, 14, 20, 0.95), transparent);
        }

        .roulette-viewport {
            width: 100%;
            height: 150px;
            overflow: hidden;
            position: relative;
        }

        .carousel-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 10px;
            height: 130px;
            transform: translateX(0px);
            will-change: transform;
        }

        /* Eşya Kartı */
        .item-card {
            flex-shrink: 0;
            width: 130px;
            height: 130px;
            margin: 0 5px;
            background: #1a1a26;
            border-bottom: 4px solid #fff;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px 6px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .item-card svg {
            width: 85px;
            height: 45px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            margin: auto 0;
            transition: transform 0.3s;
        }

        .item-card .weapon-name {
            font-size: 10px;
            color: #cfd8dc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .item-card .skin-name {
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            margin-top: 2px;
        }

        /* Nadirlik Renk Sınıfları */
        .milspec { border-color: var(--milspec); background: linear-gradient(180deg, #161a36 0%, #1a1a26 100%); }
        .restricted { border-color: var(--restricted); background: linear-gradient(180deg, #23173d 0%, #1a1a26 100%); }
        .classified { border-color: var(--classified); background: linear-gradient(180deg, #35163a 0%, #1a1a26 100%); }
        .covert { border-color: var(--covert); background: linear-gradient(180deg, #3d1419 0%, #1a1a26 100%); }
        .special { border-color: var(--special); background: linear-gradient(180deg, #3d3508 0%, #1a1a26 100%); }

        /* Butonlar ve Kontroller */
        .btn-open {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
            transition: all 0.2s ease-in-out;
            letter-spacing: 1px;
        }

        .btn-open:hover:not(:disabled) {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        .btn-open:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-open:disabled {
            background: #37474f;
            color: #90a4ae;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Kazanılan Eşya Modalı */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-card {
            background: #181922;
            width: 320px;
            border-radius: 10px;
            border: 2px solid #37474f;
            padding: 25px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .modal-overlay.active { display: flex; }
        .modal-overlay.active .modal-card { transform: scale(1); }

        .modal-card h3 { font-size: 14px; text-transform: uppercase; color: #90a4ae; margin-bottom: 5px; }
        .modal-card .item-glow {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .modal-card .item-glow svg { width: 110px; height: 110px; z-index: 2; }
        .modal-glow-bg {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            filter: blur(35px);
            opacity: 0.5;
        }

        .modal-info { margin-bottom: 20px; }
        .modal-info .title { font-size: 18px; font-weight: bold; margin-bottom: 6px; }
        .modal-info .wear { font-size: 12px; color: #81909a; margin-bottom: 4px; }
        .modal-info .price { font-size: 20px; font-weight: 800; color: #4caf50; }

        .modal-close {
            background: #37474f;
            border: none;
            color: #fff;
            padding: 10px 30px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .modal-close:hover { background: #455a64; }

        /* Envanter Bölümü */
        .inventory-section {
            width: 100%;
            max-width: 900px;
            margin-top: 40px;
        }

        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #252538;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .inventory-header h2 { font-size: 18px; color: #b0bec5; }
        .inventory-header span { font-size: 18px; color: #4caf50; font-weight: 800; }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .inv-card {
            background: #151520;
            border-radius: 4px;
            border-left: 4px solid #fff;
            padding: 10px 8px;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .inv-card svg { width: 60px; height: 35px; }
        .inv-card .name { font-weight: bold; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .inv-card .price { color: #4caf50; font-weight: 800; font-size: 11px; margin-top: 2px; }
    </style>
</head>
<body>

    <h1>🚨 CS:GO CASE SIMULATOR</h1>

    <div class="roulette-container">
        <div class="pointer"></div>
        <div class="roulette-viewport">
            <div class="carousel-track" id="carouselTrack"></div>
        </div>
    </div>

    <button class="btn-open" id="openBtn" onclick="openCase()">KUTU AÇ</button>

    <div class="inventory-section">
        <div class="inventory-header">
            <h2>ENVANTERİN</h2>
            <span id="totalValue">$0.00</span>
        </div>
        <div class="inventory-grid" id="inventoryGrid"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-card">
            <h3 id="modalRarityText">YENİ EŞYA!</h3>
            <div class="item-glow" id="modalGlowContainer">
                <div class="modal-glow-bg" id="modalGlowBg"></div>
                </div>
            <div class="modal-info">
                <div class="title" id="modalTitle">AWP | Dragon Lore</div>
                <div class="wear" id="modalWear">Fabrikadan Yeni Çıkmış (0.02)</div>
                <div class="price" id="modalPrice">$4,500.00</div>
            </div>
            <button class="modal-close" onclick="closeModal()">ENVANTERE EKLE</button>
        </div>
    </div>

    <script>
        // Silah SVG Şablonları (Yüksek Kaliteli Vektörel Tasarımlar)
        const weaponSVGs = {
            rifle: `<svg viewBox="0 0 120 40"><path d="M5 25h18l4-3h4l2 3h35l4-5h20l3 5h10v3H95L75 33H55l-15-2L25 35H5z M60 17h10v5H60z" fill="currentColor"/></svg>`,
            sniper: `<svg viewBox="0 0 120 40"><path d="M5 23h25l3-3h5l2 3h20l3-5h20l3 5h25v3l-10 4H75l-15-2H40l-15 4H5z M50 15h12v4H50z M70 15h12v4H70z" fill="currentColor"/></svg>`,
            pistol: `<svg viewBox="0 0 120 60"><path d="M30 15h50l3 5v12H55l-3 18H35l3-18H30z" fill="currentColor"/></svg>`,
            knife: `<svg viewBox="0 0 120 40"><path d="M15 22h35l3-3 40-5-5 10-35 2-3 4H15z" fill="currentColor"/></svg>`
        };

        // Kasa İçeriği (İsim, Tip, Nadirlik ve Taban Fiyat Parametreleri)
        const itemDatabase = [
            // Mil-Spec (Mavi) - %79.92
            { name: "P90", skin: "Grim", type: "rifle", rarity: "milspec", basePrice: 0.50 },
            { name: "Glock-18", skin: "Sacrifice", type: "pistol", rarity: "milspec", basePrice: 0.80 },
            { name: "M4A4", skin: "Magnesium", type: "rifle", rarity: "milspec", basePrice: 1.20 },
            { name: "USP-S", skin: "Yeti", type: "pistol", rarity: "milspec", basePrice: 1.50 },

            // Restricted (Mor) - %15.98
            { name: "AK-47", skin: "Uncharted", type: "rifle", rarity: "restricted", basePrice: 4.50 },
            { name: "MAC-10", skin: "Disco Tech", type: "rifle", rarity: "restricted", basePrice: 5.00 },
            { name: "USP-S", skin: "Cortex", type: "pistol", rarity: "restricted", basePrice: 7.50 },

            // Classified (Pembe) - %3.20
            { name: "Desert Eagle", skin: "Printstream", type: "pistol", rarity: "classified", basePrice: 55.00 },
            { name: "M4A1-S", skin: "Player Two", type: "rifle", rarity: "classified", basePrice: 60.00 },
            { name: "USP-S", skin: "Neo-Noir", type: "pistol", rarity: "classified", basePrice: 40.00 },

            // Covert (Kırmızı) - %0.64
            { name: "AK-47", skin: "Asiimov", type: "rifle", rarity: "covert", basePrice: 180.00 },
            { name: "AWP", skin: "Hyper Beast", type: "sniper", rarity: "covert", basePrice: 220.00 },
            { name: "M4A4", skin: "Howl", type: "rifle", rarity: "covert", basePrice: 1500.00 },

            // Special (Altın) - %0.26
            { name: "Karambit", skin: "Fade", type: "knife", rarity: "special", basePrice: 1200.00 },
            { name: "M9 Bayonet", skin: "Crimson Web", type: "knife", rarity: "special", basePrice: 1500.00 },
            { name: "Butterfly Knife", skin: "Doppler", type: "knife", rarity: "special", basePrice: 1800.00 }
        ];

        let audioCtx = null;
        let isSpinning = false;
        let lastTickIndex = -1;
        let inventory = [];
        let pendingWonItem = null; // Animasyon bittiğinde modala aktarılacak olan eşya

        // Web Audio API ile Mekanik Çıtlama (Tick) Sesi Sentezi
        function playTickSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(15, audioCtx.currentTime + 0.06);

                gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.06);
            } catch (e) {
                console.log("Tarayıcı ses politikası engeli.");
            }
        }

        // Rastgele Aşınma (Float) Değeri ve Aşınma Sınıfı Oluşturucu
        function generateWear() {
            const f = Math.random();
            let label = "";
            let priceMultiplier = 1;

            if (f < 0.07) {
                label = "Fabrikadan Yeni Çıkmış (Factory New)";
                priceMultiplier = 1.5;
            } else if (f < 0.15) {
                label = "Az Aşınmış (Minimal Wear)";
                priceMultiplier = 1.2;
            } else if (f < 0.38) {
                label = "Görevde Kullanılmış (Field-Tested)";
                priceMultiplier = 0.9;
            } else if (f < 0.45) {
                label = "Eskimiş (Well-Worn)";
                priceMultiplier = 0.7;
            } else {
                label = "Savaş Görmüş (Battle-Scarred)";
                priceMultiplier = 0.4;
            }

            return { float: f.toFixed(4), label, multiplier: priceMultiplier };
        }

        // Orijinal CS:GO Olasılık Algoritması
        function rollRarity() {
            const chance = Math.random() * 100;
            if (chance < 0.26) return "special";
            if (chance < 0.26 + 0.64) return "covert";
            if (chance < 0.26 + 0.64 + 3.20) return "classified";
            if (chance < 0.26 + 0.64 + 3.20 + 15.98) return "restricted";
            return "milspec";
        }

        function getRandomItem() {
            const targetRarity = rollRarity();
            const pool = itemDatabase.filter(i => i.rarity === targetRarity);
            // Seçilen havuzdan rastgele bir silah
            const item = pool[Math.floor(Math.random() * pool.length)];
            const wearInfo = generateWear();
            const finalPrice = (item.basePrice * wearInfo.multiplier).toFixed(2);

            return {
                ...item,
                float: wearInfo.float,
                wearLabel: wearInfo.label,
                price: parseFloat(finalPrice)
            };
        }

        // Kart Arayüzü HTML Oluşturma
        function createCardHTML(item) {
            return `
                <div class="item-card ${item.rarity}">
                    <div class="weapon-name">${item.name}</div>
                    ${weaponSVGs[item.type]}
                    <div class="skin-name">${item.skin}</div>
                </div>
            `;
        }

        // KUTU AÇMA ANA FONKSİYONU
        function openCase() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('openBtn').disabled = true;

            const track = document.getElementById('carouselTrack');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            // Rulet Şeridini Yeniden Doldur (Toplam 75 eşya spin atacak)
            const totalItemsInSpin = 75;
            const winningIndex = 65; // Kazanan kart 65. sırada yer alır
            
            let trackHTML = '';
            let spinItems = [];

            for (let i = 0; i < totalItemsInSpin; i++) {
                if (i === winningIndex) {
                    pendingWonItem = getRandomItem();
                    spinItems.push(pendingWonItem);
                } else {
                    // Rastgele doldurma kartları
                    const randomItem = itemDatabase[Math.floor(Math.random() * itemDatabase.length)];
                    spinItems.push(randomItem);
                }
                trackHTML += createCardHTML(spinItems[i]);
            }

            track.innerHTML = trackHTML;

            // Kart Ölçüleri: Kart Genişliği: 130px + Margins: 10px (sol/sağ 5px) = 140px toplam kaplama alanı.
            const cardFullWidth = 140; 
            const containerWidth = document.querySelector('.roulette-viewport').offsetWidth;
            
            // Tam ortalamak için ince hesap
            const centerOffset = containerWidth / 2;
            const targetCardOffset = (winningIndex * cardFullWidth) + (cardFullWidth / 2);
            
            // CS:GO'daki gibi tam merkez yerine kartın içinde rastgele bir yere durma simülasyonu
            const randomOffsetInsideCard = Math.floor(Math.random() * 80) - 40; // -40px ile +40px arası salınım

            const finalTranslate = -(targetCardOffset - centerOffset + randomOffsetInsideCard);

            // Akıcı bir frenleme ve durma için özel Cubic-Bezier (CS:GO tekerlek duruş hissi)
            setTimeout(() => {
                track.style.transition = 'transform 6.5s cubic-bezier(0.08, 0.6, 0.1, 1)';
                track.style.transform = `translateX(${finalTranslate}px)`;
                
                // Kayma hızıyla tetiklenen dinamik çıtlama takibi
                lastTickIndex = -1;
                requestAnimationFrame(updateTickPhysics);
            }, 50);

            // Spin Bitiminde Modalı Aç
            setTimeout(() => {
                isSpinning = false;
                showWinnerModal(pendingWonItem);
            }, 6600);
        }

        // Kayma konumunu eşzamanlı izleyip tam kart geçişlerinde çıtlama sesini tetikleyen döngü
        function updateTickPhysics() {
            if (!isSpinning) return;

            const track = document.getElementById('carouselTrack');
            const style = window.getComputedStyle(track);
            const matrix = new DOMMatrixReadOnly(style.transform);
            const currentTranslateX = Math.abs(matrix.m41); 

            const cardFullWidth = 140; 
            // Mevcut konumun kaçıncı kart sınırına ulaştığını analiz et
            const currentItemIndex = Math.floor((currentTranslateX + 70) / cardFullWidth);

            if (currentItemIndex !== lastTickIndex && currentItemIndex >= 0) {
                playTickSound();
                lastTickIndex = currentItemIndex;
            }

            requestAnimationFrame(updateTickPhysics);
        }

        // Kazanılan Eşyanın Bilgilerini Modala Yazdır
        function showWinnerModal(item) {
            const modal = document.getElementById('modal');
            const rarityText = document.getElementById('modalRarityText');
            const glowBg = document.getElementById('modalGlowBg');
            const glowContainer = document.getElementById('modalGlowContainer');
            const title = document.getElementById('modalTitle');
            const wear = document.getElementById('modalWear');
            const price = document.getElementById('modalPrice');

            // Eski SVG'yi temizle ve yeni kazanılanı ekle
            const existingSVG = glowContainer.querySelector('svg');
            if (existingSVG) existingSVG.remove();
            
            glowContainer.insertAdjacentHTML('beforeend', weaponSVGs[item.type]);

            // Renk ve Nadirlik Atamaları
            let colorHex = 'var(--milspec)';
            let rarityName = 'Tüketici Sınıfı';
            if (item.rarity === 'restricted') { colorHex = 'var(--restricted)'; rarityName = 'Sınırlı'; }
            if (item.rarity === 'classified') { colorHex = 'var(--classified)'; rarityName = 'Gizli'; }
            if (item.rarity === 'covert') { colorHex = 'var(--covert)'; rarityName = 'Gizli Ötesi'; }
            if (item.rarity === 'special') { colorHex = 'var(--special)'; rarityName = 'Özel Nadir Eşya ★'; }

            rarityText.innerText = rarityName;
            rarityText.style.color = colorHex;
            glowBg.style.backgroundColor = colorHex;
            glowContainer.querySelector('svg').style.color = colorHex;

            title.innerText = `${item.name} | ${item.skin}`;
            wear.innerText = `${item.wearLabel} (Float: ${item.float})`;
            price.innerText = `$${item.price.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            
            // Eşyayı yerel envantere dahil et
            inventory.unshift(pendingWonItem);
            updateInventoryUI();

            document.getElementById('openBtn').disabled = false;
        }

        // Envanter Arayüzü Güncelleyici
        function updateInventoryUI() {
            const grid = document.getElementById('inventoryGrid');
            const totalValEl = document.getElementById('totalValue');
            grid.innerHTML = '';

            let totalVal = 0;

            inventory.forEach((item) => {
                totalVal += item.price;

                let colorHex = 'var(--milspec)';
                if (item.rarity === 'restricted') colorHex = 'var(--restricted)';
                if (item.rarity === 'classified') colorHex = 'var(--classified)';
                if (item.rarity === 'covert') colorHex = 'var(--covert)';
                if (item.rarity === 'special') colorHex = 'var(--special)';

                const invCard = document.createElement('div');
                invCard.className = `inv-card`;
                invCard.style.borderLeftColor = colorHex;
                invCard.innerHTML = `
                    <div class="name" style="color: ${colorHex}">${item.name}</div>
                    ${weaponSVGs[item.type]}
                    <div class="price">$${item.price.toFixed(2)}</div>
                `;
                // SVG rengini ata
                invCard.querySelector('svg').style.color = colorHex;
                grid.appendChild(invCard);
            });

            totalValEl.innerText = `$${totalVal.toLocaleString('en-US', { minimumFractionDigits: 2 })}`;
        }

        // Sayfa ilk açıldığında gösteri amaçlı pasif kartlar yükle
        window.onload = () => {
            const track = document.getElementById('carouselTrack');
            let initialHTML = '';
            for (let i = 0; i < 15; i++) {
                const randomItem = itemDatabase[Math.floor(Math.random() * itemDatabase.length)];
                initialHTML += createCardHTML(randomItem);
            }
            track.innerHTML = initialHTML;
        };
    </script>
</body>
</html>
