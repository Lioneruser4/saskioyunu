<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BACKROOMS - Among Us 3D FPS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Arial', sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }
        #canvas { display: block; width: 100%; height: 100vh; }
        
        .lobby { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a0a0a 0%, #0f0505 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }
        
        .lobby-content {
            background: rgba(10, 10, 10, 0.95);
            padding: 40px;
            border-radius: 15px;
            border: 3px solid #ff6600;
            max-width: 600px;
            box-shadow: 0 0 50px rgba(255, 102, 0, 0.3);
        }
        
        .lobby-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            color: #ff6600;
            text-shadow: 0 0 20px rgba(255, 102, 0, 0.8);
        }
        
        .color-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .color-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .color-btn:hover, .color-btn.selected {
            border-color: #fff;
            transform: scale(1.1);
            box-shadow: 0 0 20px currentColor;
        }
        
        .settings-group {
            margin-bottom: 20px;
        }
        
        .settings-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #aaa;
        }
        
        .settings-input, .settings-select {
            width: 100%;
            padding: 10px;
            background: rgba(30, 30, 30, 0.8);
            border: 1px solid #ff6600;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .settings-input:focus, .settings-select:focus {
            outline: none;
            border-color: #ffaa00;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.3);
        }
        
        .slider-value {
            float: right;
            color: #ff6600;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            pointer-events: auto;
        }
        
        .btn-start {
            background: linear-gradient(135deg, #ff6600 0%, #ff8833 100%);
            color: white;
        }
        
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 25px rgba(255, 102, 0, 0.6);
        }
        
        .hud {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            z-index: 50;
            pointer-events: auto;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #ff6600;
        }
        
        .hud-item {
            margin-bottom: 10px;
            color: #ffaa00;
        }
        
        .killer-hud {
            position: fixed;
            bottom: 100px;
            left: 20px;
            background: rgba(100, 20, 20, 0.9);
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid #ff3333;
            pointer-events: auto;
            z-index: 50;
            display: none;
        }
        
        .kill-button {
            background: #ff3333;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            transition: all 0.2s;
        }
        
        .kill-button:hover:not(:disabled) {
            background: #ff5555;
            transform: scale(1.05);
        }
        
        .kill-button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .report-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 50, 100, 0.9);
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid #3366ff;
            pointer-events: auto;
            z-index: 50;
            display: none;
        }
        
        .report-button {
            background: #3366ff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
        }
        
        .report-button:hover:not(:disabled) {
            background: #5588ff;
        }
        
        .vote-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 30, 0.98);
            padding: 30px;
            border-radius: 15px;
            border: 3px solid #ff6600;
            max-height: 80vh;
            overflow-y: auto;
            pointer-events: auto;
            z-index: 200;
            text-align: center;
            display: none;
        }
        
        .vote-title { font-size: 24px; margin-bottom: 20px; color: #ff6600; }
        .vote-timer { font-size: 18px; color: #ff8844; margin-bottom: 20px; font-weight: bold; }
        
        .vote-list { max-height: 400px; overflow-y: auto; margin-bottom: 20px; }
        .vote-player {
            background: rgba(50, 50, 70, 0.6);
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .vote-player:hover {
            background: rgba(70, 70, 100, 0.8);
            border-color: #ff6600;
        }
        
        .vote-player-color {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .tasks-ui {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(20, 60, 20, 0.9);
            padding: 15px 20px;
            border-radius: 8px;
            border: 2px solid #44ff44;
            max-width: 250px;
            pointer-events: auto;
            z-index: 50;
            display: none;
        }
        
        .task-item {
            background: rgba(30, 80, 30, 0.7);
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 6px;
            border-left: 3px solid #44ff44;
            font-size: 12px;
        }
        
        .task-item.completed {
            border-left-color: #ff6666;
            opacity: 0.6;
            text-decoration: line-through;
        }
        
        .crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        
        .crosshair::before {
            content: '+';
            position: absolute;
            font-size: 24px;
            color: #44ff44;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="lobby" class="lobby">
        <div class="lobby-content">
            <div class="lobby-title">THE BACKROOMS</div>
            
            <div style="margin-bottom: 20px;">
                <div class="settings-label">RENG SEÇ (Oyuncu Rolü)</div>
                <div class="color-selector" id="colorSelector"></div>
            </div>
            
            <div class="settings-group">
                <label class="settings-label">
                    Oyuncu Sayısı <span class="slider-value" id="playerCountValue">4</span>
                </label>
                <input type="range" id="playerCount" class="settings-input" min="4" max="10" value="4">
            </div>
            
            <div class="settings-group">
                <label class="settings-label">
                    İmpostor Sayısı <span class="slider-value" id="killerCountValue">1</span>
                </label>
                <input type="range" id="killerCount" class="settings-input" min="1" max="2" value="1">
            </div>
            
            <div class="settings-group">
                <label class="settings-label">
                    Oyun Süresi (dakika) <span class="slider-value" id="gameDurationValue">10</span>
                </label>
                <input type="range" id="gameDuration" class="settings-input" min="5" max="30" value="10">
            </div>
            
            <div class="button-group">
                <button class="btn btn-start" id="startBtn">OYUNU BAŞLAT</button>
            </div>
        </div>
    </div>
    
    <div class="ui-container">
        <div class="crosshair"></div>
        
        <div class="hud" id="hud">
            <div class="hud-item" id="roleDisplay">Rol: Bekleniyor...</div>
            <div class="hud-item" id="healthDisplay">Sağlık: 100%</div>
            <div class="hud-item" id="timerDisplay">Zaman: 10:00</div>
            <div class="hud-item" id="coordsDisplay">Pos: (0, 0, 0)</div>
        </div>
        
        <div id="killerPanel" class="killer-hud">
            <div style="font-size: 14px; color: #ff8888;">İMPOSTOR</div>
            <button class="kill-button" id="killBtn" disabled>ÖLDÜR (E) - Yakında</button>
            <div style="font-size: 12px; margin-top: 5px; color: #ffaaaa;" id="killCooldown"></div>
        </div>
        
        <div id="reportPanel" class="report-panel">
            <div style="font-size: 14px; margin-bottom: 10px;">ÖLÜ KARAKTER BULUNDU</div>
            <button class="report-button" id="reportBtn">RAPOR ET (R)</button>
        </div>
        
        <div id="votePanel" class="vote-panel">
            <div class="vote-title">OYLAMA</div>
            <div class="vote-timer" id="voteTimer">30</div>
            <div class="vote-list" id="voteList"></div>
        </div>
        
        <div id="tasksUI" class="tasks-ui">
            <div style="color: #44ff44; font-weight: bold; margin-bottom: 10px;">GÖREVLER</div>
            <div id="tasksList"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
    <script src="main.js"></script>
</body>
</html>
