<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>8 Pool Bilardo - GitHub Pages Standalone</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #070a12; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
    header { background: rgba(15, 23, 42, 0.9); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .hud-title { font-weight: bold; color: #10b981; font-size: 16px; }
    .hud-info { font-size: 13px; color: #94a3b8; }
    #canvas-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; background: #020617; }
    canvas { max-width: 100%; max-height: 100%; display: block; }
    .controls-overlay { position: absolute; bottom: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; }
    .btn { pointer-events: auto; background: #10b981; color: #000; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn:hover { background: #34d399; }
  </style>
</head>
<body>
  <header>
    <div class="hud-title">🎱 8 Pool Bilardo</div>
    <div id="turn-indicator" class="hud-info">Sıra: Oyuncu 1</div>
    <button class="btn" onclick="resetGame()">Yeniden Başlat</button>
  </header>

  <div id="canvas-container">
    <canvas id="poolCanvas" width="1090" height="590"></canvas>
  </div>

  <script>
    // Telegram WebApp Auto-Login
    let playerName = 'Player 1';
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        playerName = tg.initDataUnsafe.user.first_name || 'Telegram Oyuncusu';
      }
    }

    const canvas = document.getElementById('poolCanvas');
    const ctx = canvas.getContext('2d');
    const turnIndicator = document.getElementById('turn-indicator');

    const TABLE_WIDTH = 1000, TABLE_HEIGHT = 500, RAIL_WIDTH = 45, BALL_RADIUS = 13.5;
    let balls = [], cueBall = null, aimAngle = 0, power = 0, isAiming = false, currentTurn = 1;

    const COLORS = {
      0: '#f8fafc', 1: '#eab308', 2: '#2563eb', 3: '#dc2626', 4: '#7c3aed',
      5: '#ea580c', 6: '#16a34a', 7: '#881337', 8: '#09090b',
      9: '#eab308', 10: '#2563eb', 11: '#dc2626', 12: '#7c3aed',
      13: '#ea580c', 14: '#16a34a', 15: '#881337'
    };

    function initBalls() {
      balls = [];
      cueBall = { id: 0, num: 0, x: 250, y: 250, vx: 0, vy: 0, type: 'cue', color: '#fff', inPocket: false };
      balls.push(cueBall);

      const apexX = 720, apexY = 250, spacing = BALL_RADIUS * 2 + 0.5, rowSpacing = spacing * 0.866;
      const order = [1, 9, 2, 3, 8, 10, 11, 4, 12, 5, 7, 13, 6, 14, 15];
      let idx = 0;
      for (let r = 0; r < 5; r++) {
        const startY = apexY - (r * spacing) / 2;
        for (let c = 0; c <= r; c++) {
          const num = order[idx++];
          balls.push({
            id: num, num: num,
            x: apexX + r * rowSpacing, y: startY + c * spacing,
            vx: 0, vy: 0, type: num === 8 ? '8ball' : (num < 8 ? 'solid' : 'stripe'),
            color: COLORS[num], inPocket: false
          });
        }
      }
    }

    function resetGame() {
      initBalls();
      currentTurn = 1;
      updateTurnText();
    }

    function updateTurnText() {
      turnIndicator.textContent = currentTurn === 1 ? 'Sıra: ' + playerName : 'Sıra: Bot / Oyuncu 2';
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      // Table Frame
      ctx.fillStyle = '#2c1810';
      ctx.roundRect(0, 0, canvas.width, canvas.height, 24);
      ctx.fill();

      // Felt
      ctx.fillStyle = '#0d6338';
      ctx.fillRect(RAIL_WIDTH, RAIL_WIDTH, TABLE_WIDTH, TABLE_HEIGHT);

      // Pockets
      const pockets = [
        {x: 0, y: 0}, {x: TABLE_WIDTH/2, y: 0}, {x: TABLE_WIDTH, y: 0},
        {x: 0, y: TABLE_HEIGHT}, {x: TABLE_WIDTH/2, y: TABLE_HEIGHT}, {x: TABLE_WIDTH, y: TABLE_HEIGHT}
      ];
      ctx.fillStyle = '#000';
      for(const p of pockets) {
        ctx.beginPath();
        ctx.arc(RAIL_WIDTH + p.x, RAIL_WIDTH + p.y, 25, 0, Math.PI*2);
        ctx.fill();
      }

      // Balls
      for(const b of balls) {
        if(b.inPocket) continue;
        const cx = RAIL_WIDTH + b.x, cy = RAIL_WIDTH + b.y;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.arc(cx, cy, BALL_RADIUS, 0, Math.PI*2);
        ctx.fill();
        if(b.num > 0) {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(cx, cy, 6, 0, Math.PI*2);
          ctx.fill();
          ctx.fillStyle = '#000';
          ctx.font = 'bold 8px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(b.num, cx, cy);
        }
      }

      // Aim Line & Cue
      if(isAiming && !cueBall.inPocket) {
        const cx = RAIL_WIDTH + cueBall.x, cy = RAIL_WIDTH + cueBall.y;
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.setLineDash([4,4]);
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(aimAngle)*200, cy + Math.sin(aimAngle)*200);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.restore();
    }

    function updatePhysics() {
      for(const b of balls) {
        if(b.inPocket) continue;
        b.x += b.vx; b.y += b.vy;
        b.vx *= 0.99; b.vy *= 0.99;
        if(Math.hypot(b.vx, b.vy) < 0.05) { b.vx = 0; b.vy = 0; }

        // Cushions
        if(b.x < BALL_RADIUS) { b.x = BALL_RADIUS; b.vx = -b.vx*0.9; }
        if(b.x > TABLE_WIDTH - BALL_RADIUS) { b.x = TABLE_WIDTH - BALL_RADIUS; b.vx = -b.vx*0.9; }
        if(b.y < BALL_RADIUS) { b.y = BALL_RADIUS; b.vy = -b.vy*0.9; }
        if(b.y > TABLE_HEIGHT - BALL_RADIUS) { b.y = TABLE_HEIGHT - BALL_RADIUS; b.vy = -b.vy*0.9; }

        // Pockets
        const pockets = [{x:0,y:0},{x:500,y:0},{x:1000,y:0},{x:0,y:500},{x:500,y:500},{x:1000,y:500}];
        for(const p of pockets) {
          if(Math.hypot(b.x - p.x, b.y - p.y) < 24) {
            b.inPocket = true;
            b.vx = 0; b.vy = 0;
            if(b.id === 0) {
              setTimeout(() => { b.inPocket = false; b.x = 250; b.y = 250; }, 800);
            }
          }
        }
      }

      // Ball collisions
      for(let i=0; i<balls.length; i++) {
        for(let j=i+1; j<balls.length; j++) {
          const b1 = balls[i], b2 = balls[j];
          if(b1.inPocket || b2.inPocket) continue;
          const dx = b2.x - b1.x, dy = b2.y - b1.y, dist = Math.hypot(dx, dy);
          if(dist < BALL_RADIUS*2 && dist > 0.001) {
            const nx = dx/dist, ny = dy/dist;
            const kx = b1.vx - b2.vx, ky = b1.vy - b2.vy;
            const p = 2 * (nx*kx + ny*ky) / 2;
            b1.vx -= p*nx*0.95; b1.vy -= p*ny*0.95;
            b2.vx += p*nx*0.95; b2.vy += p*ny*0.95;
          }
        }
      }
    }

    function loop() {
      updatePhysics();
      draw();
      requestAnimationFrame(loop);
    }

    // Touch / Mouse Aim & Shoot
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mx = (e.clientX - rect.left) * scaleX - RAIL_WIDTH;
      const my = (e.clientY - rect.top) * scaleY - RAIL_WIDTH;
      aimAngle = Math.atan2(my - cueBall.y, mx - cueBall.x);
      isAiming = true;
    });

    canvas.addEventListener('pointermove', (e) => {
      if(!isAiming) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mx = (e.clientX - rect.left) * scaleX - RAIL_WIDTH;
      const my = (e.clientY - rect.top) * scaleY - RAIL_WIDTH;
      aimAngle = Math.atan2(my - cueBall.y, mx - cueBall.x);
    });

    canvas.addEventListener('pointerup', () => {
      if(isAiming) {
        cueBall.vx = Math.cos(aimAngle) * 16;
        cueBall.vy = Math.sin(aimAngle) * 16;
        isAiming = false;
        currentTurn = currentTurn === 1 ? 2 : 1;
        updateTurnText();
      }
    });

    initBalls();
    updateTurnText();
    loop();
  </script>
</body>
</html>
