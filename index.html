<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Backrooms: Among Us - 3D FPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
        }
        #lobby {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .lobby-container {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            color: #fff;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
        }
        .lobby-title {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            letter-spacing: 3px;
        }
        .setting-group {
            margin-bottom: 25px;
        }
        .setting-label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-size: 1.1em;
            font-weight: bold;
        }
        .setting-input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #ffd700;
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            outline: none;
        }
        .setting-input:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.3);
        }
        .setting-slider {
            width: 100%;
            margin-top: 10px;
        }
        .start-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 15px;
            color: #000;
            font-size: 1.3em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
        }
        .start-btn:active {
            transform: scale(0.95);
        }
        select.setting-input {
            cursor: pointer;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 100;
            display: none;
        }
        #task-list {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #00ff00;
            border-radius: 15px;
            padding: 20px;
            color: #fff;
            max-width: 300px;
        }
        .task-title {
            color: #00ff00;
            font-size: 1.2em;
            margin-bottom: 10px;
            text-align: center;
        }
        .task-item {
            margin: 8px 0;
            padding: 5px;
            background: rgba(0, 255, 0, 0.1);
            border-radius: 5px;
        }
        .task-completed {
            text-decoration: line-through;
            color: #00ff00;
        }
        #kill-button {
            position: absolute;
            bottom: 50px;
            right: 50px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #ff0000, #8b0000);
            border: 3px solid #ff4444;
            border-radius: 50%;
            color: #fff;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            pointer-events: all;
            display: none;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(255, 0, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }
        #report-prompt {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 15px 30px;
            color: #fff;
            display: none;
            pointer-events: all;
            text-align: center;
        }
        #report-prompt button {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            margin: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #voting-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 30px;
            color: #fff;
            display: none;
            pointer-events: all;
            z-index: 200;
            min-width: 400px;
        }
        #voting-screen h2 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 20px;
        }
        .vote-player {
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .vote-player:hover {
            background: rgba(255, 215, 0, 0.3);
        }
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffd700;
            border-radius: 10px;
            pointer-events: none;
        }
        @media (max-width: 768px) {
            .lobby-container {
                padding: 20px;
            }
            .lobby-title {
                font-size: 1.8em;
            }
            #kill-button {
                width: 60px;
                height: 60px;
                bottom: 30px;
                right: 30px;
                font-size: 0.8em;
            }
        }
    </style>
</head>
<body>
    <div id="lobby">
        <div class="lobby-container">
            <h1 class="lobby-title">🎭 BACKROOMS: IMPOSTOR</h1>
            <div class="setting-group">
                <label class="setting-label">👥 Oyuncu Sayısı (Botlar dahil)</label>
                <input type="range" class="setting-slider" id="playerCount" min="4" max="15" value="10" step="1">
                <span style="color:#ffd700" id="playerCountDisplay">10</span>
            </div>
            <div class="setting-group">
                <label class="setting-label">🔪 Katil Sayısı</label>
                <input type="range" class="setting-slider" id="impostorCount" min="1" max="3" value="2" step="1">
                <span style="color:#ffd700" id="impostorCountDisplay">2</span>
            </div>
            <div class="setting-group">
                <label class="setting-label">⏱️ Oyun Süresi (dakika)</label>
                <input type="range" class="setting-slider" id="gameTime" min="3" max="15" value="5" step="1">
                <span style="color:#ffd700" id="gameTimeDisplay">5</span>
            </div>
            <div class="setting-group">
                <label class="setting-label">🖱️ Mouse Hassasiyeti</label>
                <input type="range" class="setting-slider" id="mouseSensitivity" min="0.5" max="3" value="1.5" step="0.1">
                <span style="color:#ffd700" id="sensitivityDisplay">1.5</span>
            </div>
            <div class="setting-group">
                <label class="setting-label">🎯 Zorluk</label>
                <select class="setting-input" id="difficulty">
                    <option value="easy">Kolay</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Zor</option>
                </select>
            </div>
            <button class="start-btn" onclick="startGame()">🎮 OYUNU BAŞLAT</button>
        </div>
    </div>

    <div id="ui-overlay">
        <div id="task-list">
            <div class="task-title">📋 GÖREVLER</div>
            <div id="tasks-container"></div>
        </div>
        <button id="kill-button">🔪<br>ÖLDÜR</button>
        <div id="report-prompt">
            <p>⚠️ Ceset Bulundu!</p>
            <button onclick="reportBody()">📢 REPORT ET</button>
        </div>
        <div id="voting-screen">
            <h2>🗳️ OYLAMA</h2>
            <div id="vote-players"></div>
            <div id="vote-timer" style="text-align:center;margin-top:15px;color:#ffd700;"></div>
        </div>
        <canvas id="minimap" width="150" height="150"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
    <script src="game.js"></script>
</body>
</html>
